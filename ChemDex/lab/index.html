    <script>
      (function() {
        try {
          var proto = window;
          while (proto) {
            var desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
            if (desc) {
              if (desc.get && !desc.set) {
                var currentFetch = window.fetch.bind(window);
                Object.defineProperty(window, 'fetch', {
                  get: function() { return currentFetch; },
                  set: function(val) { currentFetch = val; },
                  configurable: true,
                  enumerable: true
                });
              }
              break;
            }
            proto = Object.getPrototypeOf(proto);
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
