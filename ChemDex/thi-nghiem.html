    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap");

    body {
      font-family: "Inter", sans-serif;
      background: #0f172a;
      background-image:
        radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
        radial-gradient(at 50% 0%,
          hsla(225, 39%, 30%, 0.2) 0,
          transparent 50%),
        radial-gradient(at 100% 0%,
          hsla(339, 49%, 30%, 0.2) 0,
          transparent 50%);
      color: #f8fafc;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .glass-panel {
      background: var(--tw-colors-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--tw-colors-glassBorder);
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }

    .chemical-item,
    .preset-item {
      cursor: grab;
      transition: all 0.15s;
    }

    .chemical-item:hover,
    .preset-item:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(4px);
    }

    .chemical-item:active {
      cursor: grabbing;
    }

    .preset-item {
      cursor: pointer;
    }

    #lab-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    @media (max-width: 768px) {
      #sidebar {
        position: absolute;
        z-index: 50;
        height: calc(100% - 60px);
        transform: translateX(-100%);
      }

      #sidebar.open {
        transform: translateX(0);
      }
    }

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig =
      typeof __firebase_config !== "undefined"
        ? JSON.parse(__firebase_config)
        : { apiKey: "AIzaSy_fake_key_for_demo", projectId: "chemlab-demo" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId =
      typeof __app_id !== "undefined" ? __app_id : "chemlab-pro-id";

    window.FirebaseHelper = {
      db: db,
      user: null,
      saveLabToCloud: async (labId, data) => {
        if (!window.FirebaseHelper.user) return;
        const docRef = doc(
          db,
          "artifacts",
          appId,
          "public",
          "data",
          "labs",
          labId,
        );
        await setDoc(docRef, data, { merge: true });
      },
      loadLabFromCloud: async (labId) => {
        if (!window.FirebaseHelper.user) return null;
        const docRef = doc(
          db,
          "artifacts",
          appId,
          "public",
          "data",
          "labs",
          labId,
        );
        const snap = await getDoc(docRef);
        return snap.exists() ? snap.data() : null;
      },
    };

    const initAuth = async () => {
      try {
        if (
          typeof __initial_auth_token !== "undefined" &&
          __initial_auth_token
        ) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (e) {
        console.error("Firebase auth error");
      }
    };

    onAuthStateChanged(auth, (user) => {
      window.FirebaseHelper.user = user;
    });
    initAuth();
  </script>

    function showToast(msg) {
      const t = document.getElementById("status-toast");
      t.innerText = msg;
      t.style.opacity = 1;
      setTimeout(() => (t.style.opacity = 0), 3000);
    }

    window.closeReactionOverlay = function () {
      const overlay = document.getElementById("reaction-overlay");
      overlay.style.opacity = 0;
      setTimeout(() => overlay.classList.add("hidden"), 300);
    };

    window.updateReactionOverlay = (rxn, progress) => {

      const content = document.getElementById("reaction-content");
      overlay.classList.remove("hidden");
      overlay.style.opacity = 1;

      content.innerHTML = `
          <div class="text-xs bg-cyan-900/50 text-cyan-200 px-2 py-1 rounded inline-block mb-1">${rxn.type}</div>
          <div class="font-mono text-green-400 bg-black/50 p-2 rounded break-words font-bold">${rxn.eq}</div>
          <div class="grid grid-cols-2 gap-x-2 gap-y-1 mt-2 text-[11px]">
              <div class="text-slate-400">Tham gia</div>
              <div class="text-slate-200 text-right">${rxn.req.map((k) => DB[k]?.f || k).join(" + ")}</div>
              <div class="text-slate-400">Hiện tượng</div>
              <div class="text-slate-200 text-right">${rxn.gas ? `Khí ${rxn.gas} ↑` : rxn.ppt ? `Kết tủa ${rxn.ppt} ↓` : "Đổi màu / DD"}</div>
          </div>
          <div class="mt-3 h-2 bg-white/10 rounded-full overflow-hidden relative">
              <div class="h-full bg-cyan-400 rounded-full transition-all duration-200" style="width: ${Math.min(100, progress * 100)}%"></div>
          </div>
        `;
    };

    function getPptColor(name) {
      const n = String(name || "").toUpperCase();
      if (
        n.includes("AGCL") ||
        n.includes("BASO4") ||
        n.includes("CACO3") ||
        n.includes("PBCL2")
      )
        return [250, 250, 255, 1];
      if (n.includes("AGBR")) return [255, 245, 180, 1];
      if (n.includes("AGI") || n.includes("PBI2")) return [255, 230, 50, 1];
      if (n.includes("CUOH2")) return [40, 150, 255, 0.9];
      if (n.includes("FEOH3")) return [140, 70, 30, 0.95];
      if (n.includes("FEOH2")) return [120, 180, 90, 0.95];
      if (n.includes("ALOH3") || n.includes("ZNOH2"))
        return [240, 240, 240, 0.8];
      if (
        n.includes("CUS") ||
        n.includes("FES") ||
        n.includes("PBS") ||
        n.includes("AG2S")
      )
        return [30, 30, 30, 1];
      if (n.includes("CU")) return [190, 115, 55, 1];
      if (n.includes("AG")) return [200, 200, 200, 1];
      return [240, 240, 240, 0.9];
    }

    function renderChemicals(filterTxt = "", filterCat = "all") {
      const list = document.getElementById("chemical-list");
      list.innerHTML = "";
      const txt = filterTxt.toLowerCase().trim();
      Object.entries(DB).forEach(([key, chem]) => {
        if (filterCat !== "all" && chem.cat !== filterCat) return;
        if (
          txt &&
          !chem.n.toLowerCase().includes(txt) &&
          !chem.f.toLowerCase().includes(txt)
        )
          return;

        const bg = `rgba(${chem.c[0]}, ${chem.c[1]}, ${chem.c[2]}, ${chem.s === "solid" ? 1 : chem.c[3] || 0.7})`;
        const icon =
          chem.s === "solid" ? "box" : chem.s === "gas" ? "cloud" : "droplet";
        list.innerHTML += `
            <div class="chemical-item flex items-center gap-3 p-2 mb-1 rounded-lg bg-white/5 border border-white/10"
                 onmousedown="CanvasEngine.startDrag(event, '${key}')">
                <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 border border-white/20 shadow-lg" style="background: ${bg}">
                    <i data-lucide="${icon}" class="w-4 h-4 text-white drop-shadow"></i>
                </div>
                <div class="overflow-hidden pointer-events-none">
                    <h3 class="font-bold text-sm text-gray-200 truncate">${chem.f}</h3>
                    <p class="text-[10px] text-gray-400 truncate">${chem.n}</p>
                </div>
            </div>`;
      });
      lucide.createIcons();
    }

    function filterChemicals() {
      renderChemicals(
        document.getElementById("chem-search").value,
        document.getElementById("chem-category").value,
      );
    }

                <h4 class="font-bold text-green-400 text-sm flex items-center gap-2"><i data-lucide="test-tubes" class="w-4 h-4"></i> ${p.name}</h4>
                <p class="text-[11px] text-gray-400 mt-1 leading-snug">${p.desc}</p>
            </div>`;
      });
      lucide.createIcons();
    }

    // ==================================================
    // CANVAS & PHYSICS ENGINE
    // ==================================================
    const CanvasEngine = (() => {
      const canvas = document.getElementById("lab-canvas");
      const ctx = canvas.getContext("2d");
      let w = 0,
        h = 0;
      let equipments = [];
      let draggedItem = null;
      let draggedEq = null;
      let mouseX = 0,
        mouseY = 0;

      function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        w = canvas.width = rect.width;
        h = canvas.height = rect.height;
      }
      window.addEventListener("resize", resize);
      resize();

      class Particle {
        constructor(x, y, type, color, vx = 0, vy = 0) {
          this.x = x;
          this.y = y;
          this.type = type;
          this.color = color;
          this.life = 1.0;
          this.vx = vx;
          this.vy = vy;

          // LÀM CHẬM HIỆU ỨNG VẬT LÝ
          if (type === "drop") {
            this.size = 2.5 + Math.random();
            this.vy = vy || 0.5; // Chậm hơn so với cũ
          } else if (type === "bubble") {
            this.size = Math.random() * 2 + 1;
            this.vy = -Math.random() * 0.5 - 0.2;
          } else if (type === "ppt") {
            this.size = Math.random() * 1.5 + 0.5;
            this.vy = Math.random() * 0.1 + 0.05;
          } else if (type === "fire") {
            this.size = Math.random() * 5 + 3;
            this.vx = (Math.random() - 0.5) * 1.0;
            this.vy = -Math.random() * 2 - 0.5;
          } else if (type === "splash") {
            this.size = Math.random() * 1.5 + 0.5;
            this.vx = (Math.random() - 0.5) * 1.5;
            this.vy = -Math.random() * 1.5 - 0.5;
          } else if (type === "steam" || type === "gas") {
            this.size = Math.random() * 4 + 3;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = -Math.random() * 1.0 - 0.2;
            this.life = 0.9;
          }
        }
        update(bounds, dt) {
          this.x += this.vx * dt;
          this.y += this.vy * dt;

          if (this.type === "drop") {
            this.vy += 0.05 * dt; // Trọng lực cực nhẹ, chậm rãi
            if (this.y > bounds.top) this.life = 0;
            if (this.y > bounds.bottom) this.life = 0;
          } else if (this.type === "bubble") {
            this.x += Math.sin(this.y * 0.05) * 0.2 * dt;
            if (this.y < bounds.top) this.life = 0;
          } else if (this.type === "ppt") {
            if (this.y >= bounds.bottom - this.size) {
              this.y = bounds.bottom - this.size;
              this.vy = 0;
              this.vx = 0;
            }
          } else if (
            this.type === "fire" ||
            this.type === "splash" ||
            this.type === "gas"
          ) {
            this.life -= 0.015 * dt;
            if (this.type === "splash") this.vy += 0.05 * dt;
            if (this.type === "gas") {
              this.size += 0.05 * dt;
              this.x += Math.sin(this.y * 0.02) * 0.5 * dt;
            }
          } else if (this.type === "steam") {
            this.life -= 0.008 * dt;
            this.size += 0.05 * dt;
          }
        }
        draw(ctx) {
          if (this.life <= 0) return;
          ctx.globalAlpha = Math.max(0, this.life);
          ctx.fillStyle = `rgba(${this.color[0]}, ${this.color[1]}, ${this.color[2]}, ${this.color[3] || 1})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      class Equipment {
        constructor(type, x, y) {
          this.id = Date.now() + Math.random();
          this.type = type;
          this.x = x;
          this.y = y;
          this.tilt = 0;

          if (type === "beaker") {
            this.w = 90;
            this.h = 120;
            this.cap = 500;
          } else if (type === "flask") {
            this.w = 100;
            this.h = 140;
            this.cap = 500;
          } else if (type === "tube") {
            this.w = 30;
            this.h = 150;
            this.cap = 60;
          } else if (type === "round_flask") {
            this.w = 100;
            this.h = 140;
            this.cap = 500;
          } else if (type === "cylinder") {
            this.w = 40;
            this.h = 180;
            this.cap = 200;
          } else if (type === "burner") {
            this.w = 60;
            this.h = 80;
            this.isOn = false;
          } else if (type === "stirrer") {
            this.w = 10;
            this.h = 160;
          }

          this.vol = 0;
          this.chems = {};
          this.color = [255, 255, 255, 0];
          this.temp = 25;
          this.particles = [];
          this.solidPile = []; // KHẮC PHỤC LỖI CHẤT RẮN

          this.activeRxnEq = null;
          this.rxnProgress = 0;
        }

        buildPath(ctx) {
          ctx.beginPath();
          if (this.type === "beaker") {
            ctx.rect(0, 0, this.w, this.h);
          } else if (this.type === "flask") {
            const neckW = 34,
              neckH = 45;
            ctx.moveTo(this.w / 2 - neckW / 2, 0);
            ctx.lineTo(this.w / 2 + neckW / 2, 0);
            ctx.lineTo(this.w / 2 + neckW / 2, neckH);
            ctx.lineTo(this.w, this.h);
            ctx.lineTo(0, this.h);
            ctx.lineTo(this.w / 2 - neckW / 2, neckH);
            ctx.closePath();
          } else if (this.type === "tube") {
            const r = this.w / 2;
            ctx.moveTo(0, 0);
            ctx.lineTo(this.w, 0);
            ctx.lineTo(this.w, this.h - r);
            ctx.arc(r, this.h - r, r, 0, Math.PI);
            ctx.closePath();
          } else if (this.type === "cylinder") {
            ctx.moveTo(5, 0);
            ctx.lineTo(this.w - 5, 0);
            ctx.lineTo(this.w - 5, this.h - 5);
            ctx.lineTo(this.w, this.h - 5);
            ctx.lineTo(this.w, this.h);
            ctx.lineTo(0, this.h);
            ctx.lineTo(0, this.h - 5);
            ctx.lineTo(5, this.h - 5);
            ctx.closePath();
          } else if (this.type === "round_flask") {
            const neckW = 30,
              neckH = 60,
              r = this.w / 2;
            ctx.moveTo(r - neckW / 2, 0);
            ctx.lineTo(r + neckW / 2, 0);
            ctx.lineTo(r + neckW / 2, neckH);
            // Vẽ bầu tròn
            ctx.arc(
              r,
              this.h - r,
              r,
              -Math.asin((r - neckW / 2) / r),
              Math.PI + Math.asin((r - neckW / 2) / r),
            );
            ctx.lineTo(r - neckW / 2, neckH);
            ctx.closePath();
          }
        }

        addChem(key, amt) {
          const c = DB[key];
          if (!c) return;
          if (!this.chems[key]) this.chems[key] = { amt: 0, s: c.s };
          this.chems[key].amt += amt;

          if (c.s !== "solid") {
            if (amt > 0) {
              // Rớt dung dịch từ từ
              for (let i = 0; i < 15; i++) {
                this.particles.push(
                  new Particle(
                    this.w / 2 + (Math.random() - 0.5) * 15,
                    -10 - Math.random() * 20,
                    "drop",
                    c.c,
                    (Math.random() - 0.5) * 0.2,
                    1 + Math.random(),
                  ),
                );
              }
              if (this.vol === 0) this.color = [...c.c];
              else {
                const t = amt / (this.vol + amt);
                this.color = this.color.map(
                  (v, i) => v * (1 - t) + c.c[i] * t,
                );
              }
              this.vol = Math.min(this.cap, this.vol + amt);
            }
          } else {
            // CƠ CHẾ CHẤT RẮN MỚI
            let pCount = Math.floor(amt);
            if (pCount < 5 && amt > 0) pCount = 5;
            for (let i = 0; i < pCount; i++) {
              this.solidPile.push({
                rx: (Math.random() - 0.5) * (this.w * 0.6), // tọa độ tương đối x
                ry: Math.random() * 15, // độ cao đống chất rắn (y tương đối)
                c: c.c,
                s: Math.random() * 2.5 + 1.5, // kích thước hạt
              });
            }
          }
        }

        pourInto(target) {
          if (
            this.vol <= 0 ||
            this.type === "burner" ||
            this.type === "stirrer"
          )
            return;
          // GIẢM TỐC ĐỘ RÓT
          const amt = Math.min(0.2, this.vol);
          this.vol -= amt;

          const ratio = amt / (this.vol + amt);
          Object.keys(this.chems).forEach((k) => {
            if (this.chems[k].s !== "solid") {
              const drop = this.chems[k].amt * ratio;
              this.chems[k].amt -= drop;
              target.addChem(k, drop);
            }
          });

          const lipX = this.x + (this.tilt > 0 ? this.w : 0);
          const lipY = this.y + 10;
          const targetX = target.x + target.w / 2;

          const vx = (targetX - lipX) * 0.02; // rót chậm
          target.particles.push(
            new Particle(
              lipX - target.x,
              lipY - target.y,
              "drop",
              this.color,
              vx,
              0.5,
            ),
          );
        }

        checkReactions(dt) {
          let heatSource = equipments.find(
            (e) =>
              e.type === "burner" &&
              e.isOn &&
              Math.abs(e.x - this.x) < 50 &&
              this.y < e.y &&
              this.y > e.y - 150,
          );
          let isStirred = equipments.some(
            (e) =>
              e.type === "stirrer" &&
              Math.abs(e.x - this.x) < 40 &&
              Math.abs(e.y - this.y) < 40,
          );

          if (heatSource) this.temp = Math.min(100, this.temp + 0.05 * dt);
          else this.temp = Math.max(25, this.temp - 0.01 * dt);

          if (this.temp >= 50 && this.vol > 0) {
            if (Math.random() < (this.temp - 40) * 0.002 * dt) {
              this.particles.push(
                new Particle(
                  this.w / 2 + (Math.random() - 0.5) * this.w * 0.8,
                  this.h - (this.vol / this.cap) * this.h - 5,
                  "steam",
                  [255, 255, 255, 0.2],
                ),
              );
            }
            if (this.temp >= 95 && Math.random() < 0.1 * dt) {
              this.particles.push(
                new Particle(
                  this.w / 2 + (Math.random() - 0.5) * this.w * 0.6,
                  this.h - 10,
                  "bubble",
                  [255, 255, 255, 0.4],
                ),
              );
            }
          }

          const present = Object.keys(this.chems).filter(
            (k) => this.chems[k].amt > 0.5,
          );
          if (present.length < 1) return;

          let rxns = RxnDB.filter(
            (r) =>
              r.req.every((k) => present.includes(k)) &&
              (!r.reqHeat || heatSource),
          );
          rxns.sort((a, b) => b.req.length - a.req.length);
          let rxn = rxns[0];

          if (rxn) {
            // LÀM PHẢN ỨNG SIÊU CHẬM (Hệ số 0.002)
            const speedMult =
              (isStirred ? 2 : 1) * (this.temp > 40 ? 1.5 : 1) * dt;
            const rate = rxn.speed * speedMult * 0.002;

            if (this.activeRxnEq !== rxn.eq) {
              this.activeRxnEq = rxn.eq;
              this.rxnProgress = 0;
            }
            this.rxnProgress += rate * 20;
            if (this.rxnProgress > 1) this.rxnProgress = 1;
            window.updateReactionOverlay(rxn, this.rxnProgress);

            rxn.req.forEach((k) => {
              if (this.chems[k].s === "solid" && !rxn.consumeSolid) return;
              this.chems[k].amt -= rate * 50; // tiêu thụ chậm
              if (this.chems[k].amt <= 0) delete this.chems[k];
            });

            // Xóa bớt hạt chất rắn (viên/bột) khi bị hòa tan/phản ứng
            let totalSolid = Object.values(this.chems).reduce(
              (sum, c) => (c.s === "solid" ? sum + c.amt : sum),
              0,
            );
            while (
              this.solidPile.length > totalSolid &&
              this.solidPile.length > 0
            ) {
              this.solidPile.pop(); // Từ từ mất đi
            }

            if (rxn.heat) this.temp += rxn.heat * 0.01 * dt;

            if (rxn.color) {
              this.color = this.color.map(
                (v, i) => v + (rxn.color[i] - v) * 0.02 * rate,
              );
            }

            if (rxn.gas && Math.random() < rate * 50) {
              let yStart = this.vol > 0 ? this.h - 10 : this.h - 15;
              let pType = rxn.gas === "NO2" ? "gas" : "bubble";
              let gColor = DB[rxn.gas]?.c || [255, 255, 255, 0.5];
              this.particles.push(
                new Particle(
                  this.w / 2 + (Math.random() - 0.5) * 20,
                  yStart,
                  pType,
                  gColor,
                ),
              );
            }

            if (rxn.ppt && Math.random() < rate * 25) {
              this.particles.push(
                new Particle(
                  this.w / 2 + (Math.random() - 0.5) * this.w * 0.6,
                  this.h - (this.vol / this.cap) * this.h + 10,
                  "ppt",
                  getPptColor(rxn.ppt),
                ),
              );
            }
          } else {
            this.activeRxnEq = null;
          }
        }

        update(dt) {
          if (this.type === "burner") {
            if (this.isOn && Math.random() < 0.3 * dt) {
              this.particles.push(
                new Particle(this.w / 2, 10, "fire", [
                  255,
                  100 + Math.random() * 100,
                  0,
                  0.8,
                ]),
              );
            }
          } else if (this.type !== "stirrer") {
            this.checkReactions(dt);
          }

          const liqH = (this.vol / this.cap) * this.h;
          const bounds = { top: this.h - liqH, bottom: this.h - 5 };

          for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update(bounds, dt);
            if (
              this.particles[i].life <= 0 &&
              this.particles[i].type !== "ppt"
            ) {
              if (this.particles[i].type === "drop" && this.vol > 0) {
                for (let s = 0; s < 2; s++) {
                  this.particles.push(
                    new Particle(
                      this.particles[i].x,
                      bounds.top,
                      "splash",
                      this.particles[i].color,
                    ),
                  );
                }
              }
              this.particles.splice(i, 1);
            }
          }
        }

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);

          if (this.tilt !== 0) {
            ctx.translate(this.w / 2, this.h / 2);
            ctx.rotate((this.tilt * Math.PI) / 180);
            ctx.translate(-this.w / 2, -this.h / 2);
          }

          if (this.type === "burner") {
            ctx.fillStyle = "#475569";
            ctx.fillRect(10, 60, 40, 20);
            ctx.fillStyle = "rgba(255,255,255,0.1)";
            ctx.strokeStyle = "rgba(255,255,255,0.3)";
            ctx.beginPath();
            ctx.moveTo(20, 60);
            ctx.lineTo(15, 20);
            ctx.lineTo(45, 20);
            ctx.lineTo(40, 60);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = this.isOn ? "#ef4444" : "#10b981";
            ctx.fillRect(25, 10, 10, 10);
          } else if (this.type === "stirrer") {
            ctx.fillStyle = "rgba(255,255,255,0.5)";
            ctx.beginPath();
            ctx.roundRect(0, 0, this.w, this.h, 5);
            ctx.fill();
          } else {
            ctx.strokeStyle = "rgba(255,255,255,0.6)";
            ctx.lineWidth = 2;
            this.buildPath(ctx);
            ctx.stroke();

            // Vẽ Nước/Dung dịch
            if (this.vol > 0) {
              ctx.save();
              this.buildPath(ctx);
              ctx.clip();
              const liqH = (this.vol / this.cap) * this.h;
              ctx.fillStyle = `rgba(${this.color[0]}, ${this.color[1]}, ${this.color[2]}, ${this.color[3]})`;
              ctx.fillRect(0, this.h - liqH, this.w, liqH);
              ctx.fillStyle = "rgba(255,255,255,0.2)";
              ctx.fillRect(0, this.h - liqH, this.w, 4);
              ctx.restore();
            }

            // VẼ ĐỐNG CHẤT RẮN Ở ĐÁY (LUÔN HIỂN THỊ NẾU CÓ CHẤT RẮN)
            if (this.solidPile.length > 0) {
              ctx.save();
              this.buildPath(ctx);
              ctx.clip(); // Giới hạn gọn trong bình
              this.solidPile.forEach((p) => {
                ctx.fillStyle = `rgba(${p.c[0]}, ${p.c[1]}, ${p.c[2]}, ${p.c[3] || 1})`;
                ctx.beginPath();
                // Y được tính từ đáy (this.h - 5) trừ đi độ cao tương đối p.ry
                ctx.arc(
                  this.w / 2 + p.rx,
                  this.h - 5 - p.ry,
                  p.s,
                  0,
                  Math.PI * 2,
                );
                ctx.fill();
              });
              ctx.restore();
            }
          }

          this.particles.forEach((p) => p.draw(ctx));

          if (this.type !== "burner" && this.type !== "stirrer") {
            ctx.fillStyle = this.temp > 40 ? "#ef4444" : "#94a3b8";
            ctx.font = "10px Inter";
            ctx.fillText(`${Math.round(this.temp)}°C`, 0, this.h + 15);
          }

          ctx.restore();
        }

        isInside(x, y) {
          return (
            x >= this.x &&
            x <= this.x + this.w &&
            y >= this.y &&
            y <= this.y + this.h
          );
        }
      }

      let lastTime = performance.now();
      function loop() {
        const currentTime = performance.now();
        let dt = ((currentTime - lastTime) / 16.66) * EngineTime.scale;
        if (dt > 5) dt = 5;
        lastTime = currentTime;

        ctx.clearRect(0, 0, w, h);

        const grad = ctx.createLinearGradient(0, h - 120, 0, h);
        grad.addColorStop(0, "rgba(30, 41, 59, 0.95)");
        grad.addColorStop(1, "rgba(15, 23, 42, 1)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, h - 120, w, 120);
        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        ctx.beginPath();
        ctx.moveTo(0, h - 120);
        ctx.lineTo(w, h - 120);
        ctx.stroke();

        equipments.sort(
          (a, b) =>
            (a.type === "burner" || a.type === "stirrer" ? -1 : 1) -
            (b.type === "burner" || b.type === "stirrer" ? -1 : 1),
        );

        equipments.forEach((e) => {
          if (
            draggedEq &&
            draggedEq.eq === e &&
            e.type !== "burner" &&
            e.type !== "stirrer"
          ) {
            const target = equipments.find(
              (t) =>
                t !== e &&
                t.type !== "burner" &&
                t.type !== "stirrer" &&
                Math.abs(t.x - e.x) < 80 &&
                e.y < t.y,
            );
            if (target) {
              e.tilt = e.x < target.x ? 60 : -60;
              e.pourInto(target);
            } else e.tilt = 0;
          } else e.tilt = 0;

          e.update(dt);
          e.draw(ctx);
        });

        if (draggedItem) {
          ctx.fillStyle = "rgba(255,255,255,0.15)";
          ctx.strokeStyle = "rgba(255,255,255,0.6)";
          ctx.fillRect(mouseX - 15, mouseY - 20, 30, 40);
          ctx.strokeRect(mouseX - 15, mouseY - 20, 30, 40);
          ctx.fillStyle = "white";
          ctx.font = "12px Inter";
          ctx.textAlign = "center";
          ctx.fillText(DB[draggedItem.key]?.f || "?", mouseX, mouseY + 5);
        }

        requestAnimationFrame(loop);
      }
      loop();

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: cx - rect.left, y: cy - rect.top, cx, cy };
      };

      canvas.addEventListener("mousedown", (e) => {
        const pos = getPos(e);
        for (let i = equipments.length - 1; i >= 0; i--) {
          const eq = equipments[i];
          if (eq.isInside(pos.x, pos.y)) {
            if (eq.type === "burner" && pos.y > eq.y + 50) eq.isOn = !eq.isOn;
            else draggedEq = { eq, ox: pos.x - eq.x, oy: pos.y - eq.y };
            return;
          }
        }
      });

      canvas.addEventListener("mousemove", (e) => {
        const pos = getPos(e);
        mouseX = pos.x;
        mouseY = pos.y;

        if (draggedEq) {
          draggedEq.eq.x = pos.x - draggedEq.ox;
          draggedEq.eq.y = pos.y - draggedEq.oy;
        }

        const tt = document.getElementById("tooltip");
        const hovered = equipments.find((eq) => eq.isInside(pos.x, pos.y));

        if (
          !hovered ||
          draggedEq ||
          draggedItem ||
          hovered.type === "burner" ||
          hovered.type === "stirrer"
        ) {
          tt.style.opacity = 0;
        } else {
          const chs =
            Object.keys(hovered.chems)
              .map((k) => DB[k]?.f)
              .join(" + ") || "Trống";
          let typeName =
            hovered.type === "tube"
              ? "Ống nghiệm"
              : hovered.type === "flask"
                ? "Bình tam giác"
                : hovered.type === "cylinder"
                  ? "Ống đong"
                  : hovered.type === "round_flask"
                    ? "Bình cầu"
                    : "Cốc thủy tinh";
          tt.innerHTML = `
              <div class="font-bold text-cyan-300 border-b border-white/20 pb-1 mb-1">${typeName}</div>
              <div><span class="text-gray-400">Chất:</span> ${chs}</div>
              <div><span class="text-gray-400">Thể tích:</span> ${Math.round(hovered.vol)} ml</div>
              <div><span class="text-gray-400">Nhiệt độ:</span> ${Math.round(hovered.temp)}°C</div>
            `;
          tt.style.left = pos.cx + 10 + "px";
          tt.style.top = pos.cy + 10 + "px";
          tt.style.opacity = 1;
        }
      });

      window.addEventListener("mouseup", () => {
        if (draggedItem) {
          const target = equipments.find(
            (eq) =>
              eq.type !== "burner" &&
              eq.type !== "stirrer" &&
              mouseX > eq.x &&
              mouseX < eq.x + eq.w &&
              mouseY < eq.y + eq.h,
          );
          if (target) {
            // Chất rắn thêm một lượng nhỏ mỗi lần (20 đơn vị), chất lỏng 40 đơn vị
            target.addChem(
              draggedItem.key,
              DB[draggedItem.key].s === "solid" ? 20 : 40,
            );
          }
          draggedItem = null;
        }
        if (draggedEq) draggedEq.eq.tilt = 0;
        draggedEq = null;
      });

      canvas.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          canvas.dispatchEvent(
            new MouseEvent("mousedown", {
              clientX: e.touches[0].clientX,
              clientY: e.touches[0].clientY,
            }),
          );
        },
        { passive: false },
      );
      canvas.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();
          canvas.dispatchEvent(
            new MouseEvent("mousemove", {
              clientX: e.touches[0].clientX,
              clientY: e.touches[0].clientY,
            }),
          );
        },
        { passive: false },
      );
      window.addEventListener("touchend", () =>
        window.dispatchEvent(new MouseEvent("mouseup")),
      );

      return {
        startDrag: (e, key) => {
          draggedItem = { key };
        },
        addEquipment: (type) => {
          equipments.push(
            new Equipment(
              type,
              w / 2 + (Math.random() - 0.5) * 100,
              h / 2 - 50,
            ),
          );
        },
        clearAll: () => {
          equipments = [];
          document.getElementById("tooltip").style.opacity = 0;
          closeReactionOverlay();
        },
        getEqs: () => equipments,
        serialize: () =>
          equipments.map((e) => ({
            t: e.type,
            x: e.x,
            y: e.y,
            v: e.vol,
            c: e.color,
            tmp: e.temp,
            chs: e.chems,
            on: e.isOn,
          })),
        load: (data) => {
          equipments = data.map((d) => {
            const e = new Equipment(d.t, d.x, d.y);
            e.vol = d.v;
            e.color = d.c;
            e.temp = d.tmp;
            e.chems = d.chs || {};
            e.isOn = d.on;
            return e;
          });
        },
      };
    })();

    // ==================================================
    // LAB MANAGER
    // ==================================================
    const LAB_ID = "CHEMLAB_CURRENT_02";

    const LabManager = {
      newLab: () => {
        if (confirm("Dọn dẹp bàn thí nghiệm?")) CanvasEngine.clearAll();
      },
      saveLab: async () => {
        try {
          if (window.FirebaseHelper && window.FirebaseHelper.user) {
            await window.FirebaseHelper.saveLabToCloud(LAB_ID, {
              eqs: CanvasEngine.serialize(),
              ts: Date.now(),
            });
            showToast("Đã lưu lên hệ thống Cloud thành công!");
          } else showToast("Chưa kết nối Cloud.");
        } catch (e) {
          showToast("Lỗi khi lưu Cloud.");
        }
      },
      loadLab: async () => {
        try {
          if (window.FirebaseHelper && window.FirebaseHelper.user) {
            const data = await window.FirebaseHelper.loadLabFromCloud(LAB_ID);
            if (data && data.eqs) {
              CanvasEngine.load(data.eqs);
              showToast("Đã tải dữ liệu từ Cloud.");
            } else showToast("Không tìm thấy dữ liệu.");
          } else showToast("Chưa kết nối Cloud.");
        } catch (e) {
          showToast("Lỗi tải dữ liệu.");
        }
      },
      loadPreset: (id) => {
        const p = PresetsDB.find((x) => x.id === id);
        if (!p) return;
        CanvasEngine.clearAll();
        if (window.innerWidth < 768) toggleSidebar();

        p.setup.forEach((s, idx) => {
          CanvasEngine.addEquipment(s.t);
          const eqs = CanvasEngine.getEqs();
          const target = eqs[eqs.length - 1];
          target.x = window.innerWidth / 2 - 150 + idx * 120;
          target.y = window.innerHeight / 2 - 60;
          if (s.c) target.addChem(s.c, s.v);
          if (s.t === "burner") target.x = window.innerWidth / 2 - 150;
        });
        EngineTime.setSpeed(1);
        showToast(`Đã nạp: ${p.name}`);
      },
    };

    renderChemicals();
    renderPresets();

    window.switchTab = function (tabId, btn) {
      ["chemicals", "equipment", "presets"].forEach((t) => {
        const el = document.getElementById("tab-" + t);
        if (el) {
          el.classList.add("hidden");
          el.classList.remove("flex");
        }
      });
      const target = document.getElementById("tab-" + tabId);
      if (target) {
        target.classList.remove("hidden");
        if (tabId === "chemicals") target.classList.add("flex");
      }
      document.querySelectorAll(".tab-btn").forEach((b) => {
        b.classList.remove("text-cyan-400", "border-b-2", "border-cyan-400");
        b.classList.add("text-gray-400");
      });
      if (btn) {
        btn.classList.remove("text-gray-400");
        btn.classList.add("text-cyan-400", "border-b-2", "border-cyan-400");
      }
    };

    window.toggleSidebar = function () {
      document.getElementById("sidebar").classList.toggle("open");
    };
  </script>
</body>

</html>
