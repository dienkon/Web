<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Máy tính pH - Công cụ Hóa Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800 selection:bg-blue-100 selection:text-blue-900">
    <a href="../../" class="fixed top-4 left-4 md:top-6 md:left-6 z-50 flex items-center justify-center w-10 h-10 bg-white rounded-full shadow-[0_2px_10px_rgb(0,0,0,0.06)] border border-slate-100 text-slate-400 hover:text-slate-800 hover:scale-105 active:scale-95 transition-all duration-200">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <main class="w-full max-w-md">
        <div class="glass-effect rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-6 sm:p-8">
            <div class="space-y-6">
                <!-- Tabs -->
                <div class="flex space-x-2 border-b border-slate-200 overflow-x-auto whitespace-nowrap hide-scrollbar">
                    <button class="tab-btn active px-4 py-2 text-sm font-semibold text-amber-600 border-b-2 border-amber-600" data-target="strong">Mạnh</button>
                    <button class="tab-btn px-4 py-2 text-sm font-semibold text-slate-500 hover:text-slate-700" data-target="weak">Yếu</button>
                    <button class="tab-btn px-4 py-2 text-sm font-semibold text-slate-500 hover:text-slate-700" data-target="buffer">Đệm</button>
                </div>

                <!-- Strong Acid/Base -->
                <form id="strong" class="tab-content space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Nồng độ [H+] hoặc [OH-] (M)</label>
                        <input type="number" id="ph-strong-c" step="any" placeholder="VD: 0.01" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div class="flex items-center gap-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="strongType" value="acid" checked class="text-amber-500 focus:ring-amber-500">
                            <span class="text-sm font-medium text-slate-700">Axit (H+)</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="strongType" value="base" class="text-amber-500 focus:ring-amber-500">
                            <span class="text-sm font-medium text-slate-700">Bazơ (OH-)</span>
                        </label>
                    </div>
                    <button type="button" onclick="calcStrong()" class="w-full py-4 mt-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-2xl shadow-lg transition-all active:scale-[0.98]">Tính pH</button>
                    <div id="res-strong" class="hidden mt-4 bg-amber-50 border border-amber-100 rounded-2xl p-4 text-center"></div>
                </form>

                <!-- Weak Acid/Base -->
                <form id="weak" class="tab-content hidden space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Nồng độ phân tích (C) (M)</label>
                        <input type="number" id="ph-weak-c" step="any" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Hằng số Ka hoặc Kb (K)</label>
                        <input type="text" id="ph-weak-k" placeholder="VD: 1.8e-5" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div class="flex items-center gap-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="weakType" value="acid" checked class="text-amber-500 focus:ring-amber-500">
                            <span class="text-sm font-medium text-slate-700">Axit yếu (Ka)</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="weakType" value="base" class="text-amber-500 focus:ring-amber-500">
                            <span class="text-sm font-medium text-slate-700">Bazơ yếu (Kb)</span>
                        </label>
                    </div>
                    <button type="button" onclick="calcWeak()" class="w-full py-4 mt-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-2xl shadow-lg transition-all active:scale-[0.98]">Tính pH</button>
                    <div id="res-weak" class="hidden mt-4 bg-amber-50 border border-amber-100 rounded-2xl p-4 text-center"></div>
                </form>

                <!-- Buffer -->
                <form id="buffer" class="tab-content hidden space-y-4">
                    <p class="text-xs text-slate-500 font-semibold mb-2">Phương trình Henderson-Hasselbalch</p>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">pKa của Axit</label>
                        <input type="number" id="ph-buf-pka" step="any" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Nồng độ Muối</label>
                            <input type="number" id="ph-buf-salt" step="any" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Nồng độ Axit</label>
                            <input type="number" id="ph-buf-acid" step="any" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                        </div>
                    </div>
                    <button type="button" onclick="calcBuffer()" class="w-full py-4 mt-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-2xl shadow-lg transition-all active:scale-[0.98]">Tính pH Đệm</button>
                    <div id="res-buffer" class="hidden mt-4 bg-amber-50 border border-amber-100 rounded-2xl p-4 text-center"></div>
                </form>
            </div>

            <style>
                .hide-scrollbar::-webkit-scrollbar { display: none; }
                .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
            </style>

            <script>
                // Tabs logic
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.tab-btn').forEach(b => {
                            b.classList.remove('active', 'text-amber-600', 'border-b-2', 'border-amber-600');
                            b.classList.add('text-slate-500');
                        });
                        btn.classList.add('active', 'text-amber-600', 'border-b-2', 'border-amber-600');
                        btn.classList.remove('text-slate-500');
                        
                        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                        document.getElementById(btn.dataset.target).classList.remove('hidden');
                    });
                });

                function displayResult(elId, ph) {
                    const el = document.getElementById(elId);
                    el.classList.remove('hidden');
                    let color = ph < 7 ? 'text-red-600' : (ph > 7 ? 'text-blue-600' : 'text-emerald-600');
                    el.innerHTML = `<span class="text-sm font-semibold text-slate-500">Kết quả:</span><br><span class="text-3xl font-bold ${color}">pH = ${ph.toPrecision(4)}</span>`;
                }

                function calcStrong() {
                    const c = parseFloat(document.getElementById('ph-strong-c').value);
                    if (isNaN(c) || c <= 0) return;
                    const isAcid = document.querySelector('input[name="strongType"]:checked').value === 'acid';
                    let ph = isAcid ? -Math.log10(c) : 14 + Math.log10(c);
                    displayResult('res-strong', ph);
                }

                function calcWeak() {
                    const c = parseFloat(document.getElementById('ph-weak-c').value);
                    const k = parseFloat(document.getElementById('ph-weak-k').value);
                    if (isNaN(c) || isNaN(k) || c <= 0 || k <= 0) return;
                    
                    const isAcid = document.querySelector('input[name="weakType"]:checked').value === 'acid';
                    
                    // x^2 / (c - x) = k => x^2 + kx - kc = 0
                    // delta = k^2 + 4kc
                    // x = (-k + sqrt(delta)) / 2
                    const delta = k*k + 4*k*c;
                    const h_oh = (-k + Math.sqrt(delta)) / 2;

                    let ph = isAcid ? -Math.log10(h_oh) : 14 + Math.log10(h_oh);
                    displayResult('res-weak', ph);
                }

                function calcBuffer() {
                    const pka = parseFloat(document.getElementById('ph-buf-pka').value);
                    const salt = parseFloat(document.getElementById('ph-buf-salt').value);
                    const acid = parseFloat(document.getElementById('ph-buf-acid').value);
                    
                    if (isNaN(pka) || isNaN(salt) || isNaN(acid) || acid <= 0) return;
                    
                    let ph = pka + Math.log10(salt / acid);
                    displayResult('res-buffer', ph);
                }
            </script>
        </div>
    </main>
</body>
</html>
