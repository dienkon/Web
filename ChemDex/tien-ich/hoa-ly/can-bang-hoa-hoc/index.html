<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hằng số cân bằng - Công cụ Hóa Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800 selection:bg-blue-100 selection:text-blue-900">
    <a href="../../" class="fixed top-4 left-4 md:top-6 md:left-6 z-50 flex items-center justify-center w-10 h-10 bg-white rounded-full shadow-[0_2px_10px_rgb(0,0,0,0.06)] border border-slate-100 text-slate-400 hover:text-slate-800 hover:scale-105 active:scale-95 transition-all duration-200">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <main class="w-full max-w-md">
        <div class="glass-effect rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-6 sm:p-8">
            <div class="space-y-4">
                <p class="text-xs text-slate-500 font-semibold mb-2">Cho phản ứng: aA + bB ⇌ cC + dD</p>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Hệ số a</label>
                        <input type="number" id="cb-a" step="any" placeholder="1" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">[A] lúc cân bằng</label>
                        <input type="number" id="cb-ca" step="any" placeholder="0" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Hệ số b</label>
                        <input type="number" id="cb-b" step="any" placeholder="1" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">[B] lúc cân bằng</label>
                        <input type="number" id="cb-cb" step="any" placeholder="0" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Hệ số c</label>
                        <input type="number" id="cb-c" step="any" placeholder="1" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">[C] lúc cân bằng</label>
                        <input type="number" id="cb-cc" step="any" placeholder="0" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Hệ số d</label>
                        <input type="number" id="cb-d" step="any" placeholder="1" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">[D] lúc cân bằng</label>
                        <input type="number" id="cb-cd" step="any" placeholder="0" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                </div>

                <div class="flex items-center gap-4 py-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="cbType" value="kc" checked class="text-amber-500 focus:ring-amber-500">
                        <span class="text-sm font-medium text-slate-700">Theo nồng độ (Kc)</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="cbType" value="kp" class="text-amber-500 focus:ring-amber-500">
                        <span class="text-sm font-medium text-slate-700">Theo áp suất (Kp)</span>
                    </label>
                </div>

                <button type="button" onclick="calcK()" class="w-full py-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-2xl shadow-lg transition-all active:scale-[0.98]">Tính hằng số K</button>
                
                <div id="cb-result" class="hidden mt-4 bg-amber-50 border border-amber-100 rounded-2xl p-4 text-center"></div>
            </div>

            <script>
                function calcK() {
                    const a = parseFloat(document.getElementById('cb-a').value) || 1;
                    const b = parseFloat(document.getElementById('cb-b').value) || 1;
                    const c = parseFloat(document.getElementById('cb-c').value) || 1;
                    const d = parseFloat(document.getElementById('cb-d').value) || 1;

                    const ca = parseFloat(document.getElementById('cb-ca').value) || 0;
                    const cb = parseFloat(document.getElementById('cb-cb').value) || 0;
                    const cc = parseFloat(document.getElementById('cb-cc').value) || 0;
                    const cd = parseFloat(document.getElementById('cb-cd').value) || 0;

                    const isKc = document.querySelector('input[name="cbType"]:checked').value === 'kc';
                    const prefix = isKc ? 'Kc' : 'Kp';

                    if (ca === 0 && cb === 0 && cc === 0 && cd === 0) return;

                    // K = ([C]^c * [D]^d) / ([A]^a * [B]^b)
                    // If a reactant is 0, we can't divide by zero. So we check if denominators are non-zero.
                    let numerator = Math.pow(cc, c) * Math.pow(cd, d);
                    let denominator = Math.pow(ca, a) * Math.pow(cb, b);

                    const res = document.getElementById('cb-result');
                    res.classList.remove('hidden');

                    if (denominator === 0) {
                        res.innerHTML = `<span class="text-red-600 font-bold">Lỗi: Nồng độ/Áp suất của chất phản ứng bằng 0!</span>`;
                    } else {
                        const K = numerator / denominator;
                        res.innerHTML = `<span class="text-sm font-semibold text-slate-500">Kết quả:</span><br><span class="text-2xl font-bold text-amber-600">${prefix} = ${K.toPrecision(5)}</span>`;
                    }
                }
            </script>
        </div>
    </main>
</body>
</html>
