<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phương trình Nernst - Công cụ Hóa Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800 selection:bg-blue-100 selection:text-blue-900">
    <a href="../../" class="fixed top-4 left-4 md:top-6 md:left-6 z-50 flex items-center justify-center w-10 h-10 bg-white rounded-full shadow-[0_2px_10px_rgb(0,0,0,0.06)] border border-slate-100 text-slate-400 hover:text-slate-800 hover:scale-105 active:scale-95 transition-all duration-200">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <main class="w-full max-w-md">
        <div class="glass-effect rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-6 sm:p-8">
            <div class="space-y-4">
                <p class="text-xs text-slate-500 font-semibold mb-4 text-center">E = E° - (RT/nF)lnQ</p>
                <form id="calcForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Sức điện động chuẩn (E°) (V)</label>
                        <input type="number" id="ne-e0" step="any" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Số electron trao đổi (n)</label>
                        <input type="number" id="ne-n" step="1" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Thương số phản ứng (Q)</label>
                        <input type="number" id="ne-q" step="any" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Nhiệt độ (T) (K)</label>
                        <input type="number" id="ne-t" step="any" placeholder="Mặc định: 298.15 K (25°C)" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <button type="button" onclick="calcNernst()" class="w-full py-4 mt-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-2xl shadow-lg transition-all active:scale-[0.98]">Tính E</button>
                    
                    <div id="ne-result" class="hidden mt-4 bg-amber-50 border border-amber-100 rounded-2xl p-4 text-center"></div>
                </form>
            </div>

            <script>
                function calcNernst() {
                    const e0 = parseFloat(document.getElementById('ne-e0').value);
                    const n = parseFloat(document.getElementById('ne-n').value);
                    const q = parseFloat(document.getElementById('ne-q').value);
                    let t = parseFloat(document.getElementById('ne-t').value);
                    
                    if (isNaN(t)) t = 298.15; // default 25C

                    if (isNaN(e0) || isNaN(n) || isNaN(q) || n <= 0 || q <= 0) return;

                    const R = 8.314;
                    const F = 96485;

                    const E = e0 - ((R * t) / (n * F)) * Math.log(q);

                    const res = document.getElementById('ne-result');
                    res.classList.remove('hidden');
                    res.innerHTML = `<span class="text-sm font-semibold text-slate-500">Sức điện động của pin:</span><br><span class="text-3xl font-bold text-amber-600">E = ${E.toPrecision(5)} V</span>`;
                }
            </script>
        </div>
    </main>
</body>
</html>
