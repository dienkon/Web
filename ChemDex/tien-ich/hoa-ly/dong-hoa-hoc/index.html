<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Động hóa học - Công cụ Hóa Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800 selection:bg-blue-100 selection:text-blue-900">
    <a href="../../" class="fixed top-4 left-4 md:top-6 md:left-6 z-50 flex items-center justify-center w-10 h-10 bg-white rounded-full shadow-[0_2px_10px_rgb(0,0,0,0.06)] border border-slate-100 text-slate-400 hover:text-slate-800 hover:scale-105 active:scale-95 transition-all duration-200">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <main class="w-full max-w-md">
        <div class="glass-effect rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-6 sm:p-8">
            <div class="space-y-4">
                <p class="text-xs text-slate-500 font-semibold mb-4 text-center">k = A * e<sup>-Ea/RT</sup></p>
                <form id="calcForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Hằng số tốc độ (k)</label>
                        <input type="number" id="dh-k" step="any" class="calc-dh w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Thừa số tiền mũ (A)</label>
                        <input type="number" id="dh-A" step="any" class="calc-dh w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Năng lượng hoạt hóa (Ea) (J/mol)</label>
                        <input type="number" id="dh-ea" step="any" class="calc-dh w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Nhiệt độ (T) (K)</label>
                        <input type="number" id="dh-t" step="any" class="calc-dh w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                </form>
                <p class="text-xs text-slate-400 text-center">Nhập 3 ô bất kỳ để tính ô còn lại.</p>
            </div>

            <script>
                const dhInputs = {
                    k: document.getElementById('dh-k'),
                    A: document.getElementById('dh-A'),
                    ea: document.getElementById('dh-ea'),
                    t: document.getElementById('dh-t')
                };

                const R = 8.314; // J/(mol·K)

                document.querySelectorAll('.calc-dh').forEach(el => el.addEventListener('input', (e) => {
                    let k = parseFloat(dhInputs.k.value);
                    let A = parseFloat(dhInputs.A.value);
                    let ea = parseFloat(dhInputs.ea.value);
                    let t = parseFloat(dhInputs.t.value);

                    // k = A * exp(-Ea / RT)
                    // A = k / exp(-Ea / RT)
                    // Ea = -RT * ln(k/A)
                    // T = -Ea / (R * ln(k/A))

                    if (e.target !== dhInputs.k && !isNaN(A) && !isNaN(ea) && !isNaN(t) && t !== 0) {
                        k = A * Math.exp(-ea / (R * t));
                        dhInputs.k.value = k.toPrecision(5);
                    } else if (e.target !== dhInputs.A && !isNaN(k) && !isNaN(ea) && !isNaN(t) && t !== 0) {
                        A = k / Math.exp(-ea / (R * t));
                        dhInputs.A.value = A.toPrecision(5);
                    } else if (e.target !== dhInputs.ea && !isNaN(k) && !isNaN(A) && !isNaN(t) && k > 0 && A > 0) {
                        ea = -R * t * Math.log(k / A);
                        dhInputs.ea.value = ea.toPrecision(5);
                    } else if (e.target !== dhInputs.t && !isNaN(k) && !isNaN(A) && !isNaN(ea) && k > 0 && A > 0) {
                        const ln = Math.log(k / A);
                        if (ln !== 0) {
                            t = -ea / (R * ln);
                            dhInputs.t.value = t.toPrecision(5);
                        }
                    }
                }));
            </script>
        </div>
    </main>
</body>
</html>
