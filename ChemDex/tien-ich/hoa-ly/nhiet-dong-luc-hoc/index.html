<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhiệt động lực học - Công cụ Hóa Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800 selection:bg-blue-100 selection:text-blue-900">
    <a href="../../" class="fixed top-4 left-4 md:top-6 md:left-6 z-50 flex items-center justify-center w-10 h-10 bg-white rounded-full shadow-[0_2px_10px_rgb(0,0,0,0.06)] border border-slate-100 text-slate-400 hover:text-slate-800 hover:scale-105 active:scale-95 transition-all duration-200">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <main class="w-full max-w-md">
        <div class="glass-effect rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-6 sm:p-8">
            <div class="space-y-4">
                <p class="text-xs text-slate-500 font-semibold mb-4 text-center">ΔG = ΔH - TΔS</p>
                <form id="calcForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Enthalpy (ΔH) (kJ/mol)</label>
                        <input type="number" id="nd-h" step="any" class="calc-nd w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Entropy (ΔS) (J/K·mol)</label>
                        <input type="number" id="nd-s" step="any" class="calc-nd w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Nhiệt độ (T) (K)</label>
                        <input type="number" id="nd-t" step="any" placeholder="Mặc định: 298.15 K (25°C)" class="calc-nd w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Năng lượng Gibbs (ΔG) (kJ/mol)</label>
                        <input type="number" id="nd-g" step="any" class="calc-nd w-full px-4 py-3 bg-amber-50 border border-amber-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-amber-900 font-bold">
                    </div>
                </form>
                <p class="text-xs text-slate-400 text-center">Nhập 3 ô bất kỳ để tính ô còn lại.</p>
                <div id="nd-result" class="hidden mt-4 bg-slate-50 border border-slate-200 rounded-2xl p-4 text-center"></div>
            </div>

            <script>
                const ndInputs = {
                    h: document.getElementById('nd-h'), // kJ
                    s: document.getElementById('nd-s'), // J
                    t: document.getElementById('nd-t'), // K
                    g: document.getElementById('nd-g')  // kJ
                };

                function updateResult(g) {
                    const res = document.getElementById('nd-result');
                    if (isNaN(g)) {
                        res.classList.add('hidden');
                        return;
                    }
                    res.classList.remove('hidden');
                    if (g < 0) {
                        res.innerHTML = `<span class="font-bold text-emerald-600">Phản ứng tự xảy ra (Tự phát).</span><br><span class="text-sm text-slate-600">ΔG < 0</span>`;
                    } else if (g > 0) {
                        res.innerHTML = `<span class="font-bold text-red-600">Phản ứng không tự xảy ra.</span><br><span class="text-sm text-slate-600">ΔG > 0</span>`;
                    } else {
                        res.innerHTML = `<span class="font-bold text-blue-600">Phản ứng đạt trạng thái cân bằng.</span><br><span class="text-sm text-slate-600">ΔG = 0</span>`;
                    }
                }

                document.querySelectorAll('.calc-nd').forEach(el => el.addEventListener('input', (e) => {
                    let h = parseFloat(ndInputs.h.value);
                    let s = parseFloat(ndInputs.s.value) / 1000; // Convert J to kJ
                    let t = ndInputs.t.value === '' ? 298.15 : parseFloat(ndInputs.t.value); // Default to 298.15K if empty but others are typed
                    let g = parseFloat(ndInputs.g.value);

                    // If user is typing in T but it's empty momentarily
                    if (e.target === ndInputs.t && ndInputs.t.value === '') return;
                    
                    if (e.target !== ndInputs.g && !isNaN(h) && !isNaN(s) && !isNaN(t)) {
                        g = h - (t * s);
                        ndInputs.g.value = g.toPrecision(5);
                    } else if (e.target !== ndInputs.h && !isNaN(g) && !isNaN(s) && !isNaN(t)) {
                        h = g + (t * s);
                        ndInputs.h.value = h.toPrecision(5);
                    } else if (e.target !== ndInputs.s && !isNaN(g) && !isNaN(h) && !isNaN(t) && t !== 0) {
                        s = (h - g) / t;
                        ndInputs.s.value = (s * 1000).toPrecision(5);
                    } else if (e.target !== ndInputs.t && !isNaN(g) && !isNaN(h) && !isNaN(s) && s !== 0) {
                        t = (h - g) / s;
                        ndInputs.t.value = t.toPrecision(5);
                    }
                    
                    updateResult(g);
                }));
            </script>
        </div>
    </main>
</body>
</html>
