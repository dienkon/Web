<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đo quang - Công cụ Hóa Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800 selection:bg-blue-100 selection:text-blue-900">
    <a href="../../" class="fixed top-4 left-4 md:top-6 md:left-6 z-50 flex items-center justify-center w-10 h-10 bg-white rounded-full shadow-[0_2px_10px_rgb(0,0,0,0.06)] border border-slate-100 text-slate-400 hover:text-slate-800 hover:scale-105 active:scale-95 transition-all duration-200">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <main class="w-full max-w-md">
        <div class="glass-effect rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-6 sm:p-8">
            <div class="space-y-4">
                <p class="text-xs text-slate-500 font-semibold mb-4 text-center">A = ε · l · C &nbsp; | &nbsp; A = -log(T)</p>
                <form id="calcForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Độ hấp thụ (A)</label>
                        <input type="number" id="bl-a" step="any" class="calc-bl w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Hệ số hấp thụ phân tử (ε) (L/(mol·cm))</label>
                        <input type="number" id="bl-e" step="any" class="calc-bl w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Chiều dày cuvet (l) (cm)</label>
                        <input type="number" id="bl-l" step="any" placeholder="Mặc định: 1 cm" class="calc-bl w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Nồng độ (C) (mol/L)</label>
                        <input type="number" id="bl-c" step="any" class="calc-bl w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                    
                    <div class="h-px w-full bg-slate-100 my-4"></div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Độ truyền qua (T) (%)</label>
                        <input type="number" id="bl-t" step="any" class="calc-bl w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-500/20">
                    </div>
                </form>
                <p class="text-xs text-slate-400 text-center">Nhập giá trị để hệ thống tự động tính các ô còn lại.</p>
            </div>

            <script>
                const blInputs = {
                    a: document.getElementById('bl-a'),
                    e: document.getElementById('bl-e'),
                    l: document.getElementById('bl-l'),
                    c: document.getElementById('bl-c'),
                    t: document.getElementById('bl-t')
                };

                document.querySelectorAll('.calc-bl').forEach(el => el.addEventListener('input', (event) => {
                    let a = parseFloat(blInputs.a.value);
                    let e = parseFloat(blInputs.e.value);
                    let l = blInputs.l.value === '' ? 1 : parseFloat(blInputs.l.value);
                    let c = parseFloat(blInputs.c.value);
                    let t = parseFloat(blInputs.t.value);
                    
                    if (event.target === blInputs.l && blInputs.l.value === '') return;

                    // A = -log10(T) where T is fraction. If T is %, T_frac = T / 100
                    if (event.target === blInputs.t && !isNaN(t) && t > 0) {
                        a = -Math.log10(t / 100);
                        blInputs.a.value = a.toPrecision(5);
                    } else if (event.target === blInputs.a && !isNaN(a)) {
                        t = Math.pow(10, -a) * 100;
                        blInputs.t.value = t.toPrecision(5);
                    } else if (!isNaN(a)) {
                        // Keep T in sync if A exists but wasn't the target (or was)
                        t = Math.pow(10, -a) * 100;
                        blInputs.t.value = t.toPrecision(5);
                    }

                    // A = e * l * c
                    if (event.target !== blInputs.a && event.target !== blInputs.t && !isNaN(e) && !isNaN(l) && !isNaN(c)) {
                        a = e * l * c;
                        blInputs.a.value = a.toPrecision(5);
                        t = Math.pow(10, -a) * 100;
                        blInputs.t.value = t.toPrecision(5);
                    } else if (event.target !== blInputs.e && !isNaN(a) && !isNaN(l) && !isNaN(c) && l !== 0 && c !== 0) {
                        e = a / (l * c);
                        blInputs.e.value = e.toPrecision(5);
                    } else if (event.target !== blInputs.l && !isNaN(a) && !isNaN(e) && !isNaN(c) && e !== 0 && c !== 0) {
                        l = a / (e * c);
                        blInputs.l.value = l.toPrecision(5);
                    } else if (event.target !== blInputs.c && !isNaN(a) && !isNaN(e) && !isNaN(l) && e !== 0 && l !== 0) {
                        c = a / (e * l);
                        blInputs.c.value = c.toPrecision(5);
                    }
                }));
            </script>
        </div>
    </main>
</body>
</html>
