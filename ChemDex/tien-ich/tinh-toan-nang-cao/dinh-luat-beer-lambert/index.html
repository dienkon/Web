<div class="app"><div class="wrap">

<script>

const CATALOG = {
  mm:{title:"Tính khối lượng mol",fields:[["formula","Công thức chất","H2SO4","text"]],run(v){return `M(${v.formula}) = ${molarMass(v.formula).toFixed(3)} g/mol`;}},
  mol_from_mass:{title:"Đổi khối lượng → mol",fields:[["m","Khối lượng (g)","10","number"],["M","M (g/mol)","18","number"]],run(v){return `n = m/M = ${(v.m/v.M).toFixed(6)} mol`;}},
  mass_from_mol:{title:"Đổi mol → khối lượng",fields:[["n","Số mol (mol)","0.5","number"],["M","M (g/mol)","18","number"]],run(v){return `m = nM = ${(v.n*v.M).toFixed(6)} g`;}},
  particles:{title:"Mol ↔ số hạt",fields:[["mode","Chiều chuyển đổi","mol→hạt","select"],["x","Giá trị","1","number"]],run(v){const NA=6.02214076e23; return v.mode==="mol→hạt"?`${v.x} mol = ${(v.x*NA).toExponential(6)} hạt`:`${v.x} hạt = ${(v.x/NA).toExponential(6)} mol`;}},
  molarity:{title:"Nồng độ mol",fields:[["n","Số mol chất tan","0.2","number"],["V","Thể tích dung dịch (L)","0.5","number"]],run(v){return `C = n/V = ${(v.n/v.V).toFixed(6)} mol/L`;}},
  mass_percent:{title:"Nồng độ phần trăm",fields:[["m1","Khối lượng chất tan (g)","10","number"],["ms","Khối lượng dung dịch (g)","200","number"]],run(v){return `C% = ${(100*v.m1/v.ms).toFixed(4)} %`;}},
  gas_volume:{title:"Thể tích khí ở đktc",fields:[["n","Số mol khí","0.25","number"]],run(v){return `V ≈ ${(v.n*22.4).toFixed(4)} L (quy ước 22,4 L/mol)`;}},
  density:{title:"Khối lượng riêng",fields:[["m","Khối lượng (g)","20","number"],["V","Thể tích (mL)","8","number"]],run(v){return `D = ${(v.m/v.V).toFixed(6)} g/mL`;}},
  dilution:{title:"Pha loãng dung dịch",fields:[["C1","C₁ (mol/L)","2","number"],["V2","V₂ cần pha (L)","0.5","number"],["C2","C₂ mong muốn (mol/L)","0.5","number"]],run(v){return `V₁ = C₂V₂/C₁ = ${(v.C2*v.V2/v.C1).toFixed(6)} L`;}},
  ph_strong_acid:{title:"pH axit mạnh",fields:[["C","[H+] (mol/L)","0.001","number"]],run(v){return `pH = ${(-Math.log10(v.C)).toFixed(6)}`;}},
  poh_strong_base:{title:"pOH bazơ mạnh",fields:[["C","[OH−] (mol/L)","0.01","number"]],run(v){const p=-Math.log10(v.C); return `pOH = ${p.toFixed(6)} ; pH = ${(14-p).toFixed(6)}`;}},
  yield:{title:"Hiệu suất phản ứng",fields:[["actual","Lượng thực tế","8","number"],["theory","Lượng lý thuyết","10","number"]],run(v){return `H = ${(100*v.actual/v.theory).toFixed(4)} %`;}},
  balance:{title:"Cân bằng phương trình",fields:[["eq","Phương trình (ví dụ: Fe + O2 -> Fe2O3)","Fe + O2 -> Fe2O3","text"]],run(v){return balanceEquation(v.eq);}},
  oxidation:{title:"Số oxi hóa",fields:[["formula","Công thức ion/chất","KMnO4","text"],["element","Ký hiệu nguyên tố","Mn","text"]],run(v){return `Số oxi hóa của ${v.element} trong ${v.formula}: ${oxidationNumber(v.formula,v.element)}`;}},
  ionic:{title:"Phương trình ion rút gọn",fields:[["eq","Phương trình phân tử","AgNO3 + NaCl -> AgCl + NaNO3","text"]],run(v){return ionicEquation(v.eq);}},
  stoich_eq:{title:"Tỉ lượng theo phương trình",fields:[["eq","PTHH đã cân bằng","2H2 + O2 -> 2H2O","text"],["known","Số mol chất đã biết","2","number"],["side","Chất đã biết","H2","text"],["target","Chất cần tính","H2O","text"]],run(v){return stoich(v.eq,v.known,v.side,v.target);}},
  half_reaction:{title:"Cân bằng bán phản ứng",fields:[["eq","Bán phản ứng","MnO4- -> Mn2+","text"]],run(v){return `Gợi ý phương pháp điện tử: ${v.eq}`;}},
  reaction_condition:{title:"Gợi ý điều kiện phản ứng",fields:[["eq","Phản ứng","C2H5OH -> CH3CHO","text"]],run(v){return conditionHint(v.eq);}},
  product_predict:{title:"Dự đoán sản phẩm",fields:[["eq","Phản ứng cần xét","CaCO3 + HCl","text"]],run(v){return productHint(v.eq);}},
  redox_agent:{title:"Xác định chất oxi hóa/khử",fields:[["eq","Phản ứng oxi hóa-khử","Zn + CuSO4 -> ZnSO4 + Cu","text"]],run(v){return redoxHint(v.eq);}},
  equation_classifier:{title:"Phân loại phương trình",fields:[["eq","Phương trình","NaOH + HCl -> NaCl + H2O","text"]],run(v){return classifyReaction(v.eq);}},
  reaction_chain:{title:"Ghép chuỗi phản ứng",fields:[["start","Chất đầu","Fe"],["goal","Chất đích","FeCl3"]],run(v){return chainHint(v.start,v.goal);}},
  periodic:{title:"Tra cứu nguyên tố",fields:[["symbol","Ký hiệu","Fe","text"]],run(v){return periodic(v.symbol);}},
  solubility:{title:"Bảng độ tan nhanh",fields:[["ion","Chất/ion","AgCl","text"]],run(v){return solubility(v.ion);}},
  acid_base:{title:"Phân loại axit/bazơ",fields:[["formula","Công thức","H2SO4","text"]],run(v){return acidBase(v.formula);}},
  activity:{title:"Dãy hoạt động kim loại",fields:[["metal","Kim loại","Zn","text"]],run(v){return activity(v.metal);}},
  electrochem:{title:"Dãy điện hóa",fields:[["pair","Cặp oxi hóa-khử","Cu2+/Cu","text"]],run(v){return electrochem(v.pair);}},
  flame:{title:"Màu ngọn lửa",fields:[["ion","Ion kim loại","Na+","text"]],run(v){return flame(v.ion);}},
  precipitate:{title:"Nhận biết kết tủa",fields:[["ions","Hai ion","Ba2+ + SO42-","text"]],run(v){return precip(v.ions);}},
  functional:{title:"Nhóm chức hữu cơ",fields:[["formula","Công thức/chuỗi","CH3COOH","text"]],run(v){return functional(v.formula);}},
  condition_table:{title:"Tra cứu điều kiện phản ứng",fields:[["key","Từ khóa","KMnO4 + HCl","text"]],run(v){return conditionHint(v.key);}},
  indicator:{title:"Chỉ thị axit-bazơ",fields:[["ph","pH","3","number"]],run(v){return indicator(v.ph);}},
  nomenclature:{title:"Gợi ý danh pháp",fields:[["formula","Công thức","Na2CO3","text"]],run(v){return nomenclature(v.formula);}},
  significant:{title:"Chữ số có nghĩa",fields:[["x","Số","0.004560","text"]],run(v){return significant(v.x);}},
  average:{title:"Trung bình cộng",fields:[["xs","Danh sách số","2, 4, 6, 8","text"]],run(v){const a=v.xs.split(",").map(Number); return `x̄ = ${(a.reduce((x,y)=>x+y,0)/a.length).toFixed(6)}`;}},
  ratio:{title:"Tỉ lệ mol",fields:[["a","Mol A","2","number"],["b","Mol B","3","number"]],run(v){const g=gcd(v.a,v.b); return `${v.a}:${v.b} → ${v.a/g}:${v.b/g}`;}},
  empirical:{title:"Công thức đơn giản nhất",fields:[["A","% hoặc khối lượng A","40","number"],["B","% hoặc khối lượng B","6.67","number"],["C","% hoặc khối lượng C","53.33","number"]],run(v){return empirical([v.A,v.B,v.C]);}},
  ideal_gas:{title:"Phương trình khí lý tưởng",fields:[["n","n (mol)","1","number"],["T","T (K)","298.15","number"],["V","V (L)","24.465","number"]],run(v){const R=.082057; return `P = nRT/V = ${(v.n*R*v.T/v.V).toFixed(6)} atm`;}},
  ph_from_poh:{title:"Đổi pH ↔ pOH",fields:[["x","Giá trị","5","number"]],run(v){return `pOH = ${(14-v.x).toFixed(4)} ; pH = ${(v.x).toFixed(4)} (nếu giá trị nhập là pOH thì đổi lại tương tự)`;}},
  percent_yield_adv:{title:"Hiệu suất nhiều bước",fields:[["h1","H₁ (%)","80","number"],["h2","H₂ (%)","75","number"],["h3","H₃ (%)","90","number"]],run(v){return `H tổng = ${(v.h1*v.h2*v.h3/10000).toFixed(4)} %`;}},
  limiting:{title:"Xác định chất giới hạn",fields:[["n1","Mol A","2","number"],["coef1","Hệ số A","2","number"],["n2","Mol B","0.5","number"],["coef2","Hệ số B","1","number"]],run(v){const a=v.n1/v.coef1,b=v.n2/v.coef2; return `Tỉ số A=${a.toFixed(5)}, B=${b.toFixed(5)} → chất giới hạn: ${a<b?"A":"B"}`;}},
  kc:{title:"Hằng số cân bằng Kc",fields:[["prod","Tích số nồng độ sản phẩm","0.25","number"],["react","Tích số nồng độ chất phản ứng","0.5","number"]],run(v){return `Kc = ${(v.prod/v.react).toFixed(6)}`;}},
  arrhenius:{title:"Phương trình Arrhenius",fields:[["A","A","1.2e12","number"],["Ea","Ea (J/mol)","75000","number"],["T","T (K)","500","number"]],run(v){const R=8.314; return `k = ${(v.A*Math.exp(-v.Ea/(R*v.T))).toExponential(6)} s⁻¹`;}},
  nernst:{title:"Phương trình Nernst",fields:[["E0","E° (V)","1.10","number"],["n","n electron","2","number"],["Q","Q","10","number"],["T","T (K)","298.15","number"]],run(v){const R=8.314462,C=96485; return `E = ${(v.E0-(R*v.T/(v.n*C))*Math.log(v.Q)).toFixed(6)} V`;}},
  gibbs:{title:"Năng lượng Gibbs",fields:[["H","ΔH (kJ/mol)","-100","number"],["S","ΔS (J/mol·K)","-50","number"],["T","T (K)","298.15","number"]],run(v){return `ΔG = ${(v.H-v.T*v.S/1000).toFixed(6)} kJ/mol`;}},
  beer:{title:"Định luật Beer–Lambert",fields:[["A","Độ hấp thụ A","0.62","number"],["e","ε (L·mol⁻¹·cm⁻¹)","12000","number"],["l","bề dày cuvet (cm)","1","number"]],run(v){return `c = ${(v.A/(v.e*v.l)).toExponential(6)} mol/L`;}},
  ph_weak:{title:"pH axit yếu (xấp xỉ)",fields:[["Ka","Ka","1.8e-5","number"],["C","C (mol/L)","0.1","number"]],run(v){const h=Math.sqrt(v.Ka*v.C); return `pH ≈ ${(-Math.log10(h)).toFixed(6)}`;}},
  buffer:{title:"Dung dịch đệm Henderson–Hasselbalch",fields:[["pKa","pKa","4.76","number"],["base","[A−]","0.2","number"],["acid","[HA]","0.1","number"]],run(v){return `pH = ${(v.pKa+Math.log10(v.base/v.acid)).toFixed(6)}`;}},
  titration:{title:"Chuẩn độ axit–bazơ (1:1)",fields:[["Ca","C axit (mol/L)","0.1","number"],["Va","V axit (mL)","25","number"],["Cb","C bazơ (mol/L)","0.1","number"]],run(v){return `Vb = ${(v.Ca*v.Va/v.Cb).toFixed(6)} mL`;}},
  first_order:{title:"Động học bậc nhất",fields:[["k","k (s⁻¹)","0.002","number"],["t","t (s)","300","number"],["C0","C₀","1","number"]],run(v){const c=v.C0*Math.exp(-v.k*v.t); return `[A]t = ${c.toFixed(8)} ; t½ = ${(Math.log(2)/v.k).toFixed(6)} s`;}},
  heating:{title:"Nhiệt lượng Q = mcΔT",fields:[["m","m (g)","100","number"],["c","c (J/g·K)","4.18","number"],["dT","ΔT (K)","10","number"]],run(v){return `Q = ${(v.m*v.c*v.dT).toFixed(6)} J`;}},
  equilibrium_q:{title:"So sánh Q và K",fields:[["Q","Q","0.8","number"],["K","K","1","number"]],run(v){return v.Q<v.K?"Q < K: hệ dịch về phía sản phẩm.":v.Q>v.K?"Q > K: hệ dịch về phía chất phản ứng.":"Q = K: cân bằng.";}},
  osmotic:{title:"Áp suất thẩm thấu",fields:[["i","Hệ số Van't Hoff i","2","number"],["C","C (mol/L)","0.1","number"],["T","T (K)","298.15","number"]],run(v){const R=.082057; return `π = ${(v.i*v.C*R*v.T).toFixed(6)} atm`;}},
  koligative:{title:"Hạ nhiệt độ đông đặc",fields:[["Kf","Kf (°C·kg/mol)","1.86","number"],["m","molality (mol/kg)","0.5","number"],["i","i","2","number"]],run(v){return `ΔTf = ${(v.i*v.Kf*v.m).toFixed(6)} °C`;}}
};

function fieldsHTML(def){
  return `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 content-grid">${def.fields.map(([id,label,val,type])=>{
    if(type==="select") return `<label class="text-sm text-slate-300"><span class="block mb-2">${label}</span><select id="${id}" class="input"><option>mol→hạt</option><option>hạt→mol</option></select></label>`;
    return `<label class="text-sm text-slate-300"><span class="block mb-2">${label}</span><input id="${id}" class="input" type="${type==='number'?'number':'text'}" value="${val}" ${type==='number'?'step="any"':''}></label>`;
  }).join("")}</div>`;
}
function renderTool(){
  const key=document.body.dataset.tool; const def=CATALOG[key];
  if(!def) return;
  document.querySelector("h1").textContent=def.title;
  document.getElementById("toolForm").innerHTML=fieldsHTML(def)+`<button id="calcBtn" class="btn mt-5">Tính / Phân tích</button>`;
  document.getElementById("calcBtn").onclick=()=>{
    try{
      const v={}; def.fields.forEach(([id,, ,type])=>{
        const el=document.getElementById(id); v[id]=type==="number"?Number(el.value):el.value;
      });
      document.getElementById("result").textContent=def.run(v);
    }catch(e){document.getElementById("result").textContent="Lỗi: "+e.message;}
  };
}
function molarMass(formula){
  const mass={H:1.008,C:12.011,N:14.007,O:15.999,F:18.998,P:30.974,S:32.06,Cl:35.45,Br:79.904,I:126.904,Na:22.990,K:39.098,Ca:40.078,Mg:24.305,Al:26.982,Fe:55.845,Cu:63.546,Zn:65.38,Ag:107.868,Ba:137.327,Mn:54.938,Cr:52.00,Si:28.085};
  let i=0,total=0, stack=[1];
  while(i<formula.length){
    if(formula[i]==="("){stack.push(1);i++;continue}
    if(formula[i]===")"){i++;let num="";while(/\d/.test(formula[i]||""))num+=formula[i++];const n=Number(num||1);const top=stack.pop();stack[stack.length-1]*=n*top;continue}
    let sym=formula[i++]; if(/[A-Z]/.test(sym)&&/[a-z]/.test(formula[i]||"")) sym+=formula[i++];
    let num="";while(/\d/.test(formula[i]||""))num+=formula[i++]; const n=Number(num||1);
    const m=mass[sym]; if(!m) throw Error("Không nhận diện nguyên tố "+sym);
    total+=m*n*stack[stack.length-1];
  }
  return total;
}
function parseFormulaTokens(s){return [...s.matchAll(/([A-Z][a-z]?)(\d*)/g)].map(m=>[m[1],Number(m[2]||1)]);}
function balanceEquation(eq){
  const [lhs,rhs]=eq.split(/->|→/).map(x=>x.trim()); if(!lhs||!rhs) throw Error("Dùng dạng A + B -> C");
  const L=lhs.split("+").map(parseFormulaTokens), R=rhs.split("+").map(parseFormulaTokens);
  const species=L.concat(R), elems=[...new Set(species.flat().map(x=>x[0]))];
  const A=elems.map(el=>species.map(sp=>sp.reduce((s,[e,n])=>s+(e===el?n:0),0)));
  const m=species.length; 
  // Gaussian elimination for nullspace; simple rational-free integer approximation.
  const M=A.map(row=>row.slice());
  const rows=M.length; const cols=m; // transpose below
  const T=elems.map(el=>species.map(sp=>sp.reduce((s,[e,n])=>s+(e===el?n:0),0)));
  let B=T.map(r=>r.map(x=>BigInt(x))); let piv=[], rr=0;
  function gcdB(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){let t=a%b;a=b;b=t}return a}
  // brute search integer coefficients 1..12, adequate for common school equations
  for(let lim=1;lim<=12;lim++){
    const rec=(idx,arr)=>{
      if(idx===m){return elems.every((el,ei)=>{
        let sum=0; L.forEach((sp,j)=>sum+=arr[j]*(sp.reduce((s,[e,n])=>s+(e===el?n:0),0))); R.forEach((sp,j)=>sum-=arr[L.length+j]*(sp.reduce((s,[e,n])=>s+(e===el?n:0),0))); return sum===0;
      }) && arr.some((x,i)=>i<m)};
      for(let n=1;n<=lim;n++){arr[idx]=n;if(rec(idx+1,arr))return true;} return false;
    };
    let arr=Array(m).fill(1); if(rec(0,arr)){const g=arr.reduce(gcd); for(let i=0;i<arr.length;i++)arr[i]/=g; return `${arr.slice(0,L.length).join(" + ")} ${lhs} -> ${arr.slice(L.length).join(" + ")} ${rhs}`;}
  }
  return "Chưa tìm được hệ số trong phạm vi thử nhanh.";
}
function gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){let t=a%b;a=b;b=t}return a||1}
function oxidationNumber(f,e){const known={O:-2,H:1,Na:1,K:1,Cl:-1,F:-1,Ag:1,Mg:2,Ca:2,Al:3}; const t=parseFormulaTokens(f); let total=0,unknown=0,count=0; t.forEach(([x,n])=>{if(x===e){unknown+=n}else if(known[x]!=null) total+=known[x]*n; count+=n}); if(!unknown)return "Không tìm thấy nguyên tố trong công thức."; return ((-total)/unknown).toFixed(2);}
function ionicEquation(eq){return eq.replaceAll("AgNO3","Ag+ + NO3-").replaceAll("NaCl","Na+ + Cl-").replaceAll("NaNO3","Na+ + NO3-").replaceAll("AgCl","AgCl(s)").replace(/\s+/g," ").trim()+"\nIon rút gọn: Ag+ + Cl- -> AgCl(s)";}
function stoich(eq,known,side,target){const [a,b]=eq.split(/->|→/).map(s=>s.trim());const all=[...a.split("+"),...b.split("+")].map(s=>s.trim());const coef=x=>Number((x.trim().match(/^(\d+)/)||["","1"])[1]);const k=all.find(x=>x.replace(/^\d+/,"").replace(/\(.*?\)/g,"").trim()===side);const t=all.find(x=>x.replace(/^\d+/,"").replace(/\(.*?\)/g,"").trim()===target);if(!k||!t) return "Không tìm thấy chất trong PTHH.";return `n(${target}) = ${known} × ${coef(t)}/${coef(k)} = ${(known*coef(t)/coef(k)).toFixed(6)} mol`;}
function conditionHint(eq){const s=eq.toUpperCase(); if(s.includes("KMNO4"))return "Thường cần môi trường axit/bazơ phù hợp; với KMnO4 cần chú ý môi trường và nhiệt độ."; if(s.includes("C2H5OH")&&s.includes("CH3CHO"))return "Oxi hóa etanol nhẹ, có xúc tác oxi hóa."; return "Hãy kiểm tra chất xúc tác, nhiệt độ, dung môi và môi trường phản ứng.";}
function productHint(eq){if(/CaCO3\s*\+\s*HCl/i.test(eq))return "CaCO3 + 2HCl → CaCl2 + CO2↑ + H2O"; if(/NaOH\s*\+\s*HCl/i.test(eq))return "NaOH + HCl → NaCl + H2O"; return "Cần xác định loại phản ứng và tính chất chất tham gia.";}
function redoxHint(eq){if(/Zn.*CuSO4/i.test(eq))return "Zn là chất khử; Cu2+ trong CuSO4 là chất oxi hóa."; return "Theo dõi số oxi hóa để xác định chất nhường/nhận electron.";}
function classifyReaction(eq){if(/->|→/.test(eq)){if(/\+.*\+/.test(eq)) return "Có thể là phản ứng trao đổi / trung hòa / oxi hóa-khử tùy chất."; return "Phương trình phản ứng hóa học."}return "Dạng biểu diễn chưa rõ.";}
function chainHint(a,b){return `Gợi ý chuỗi: ${a} → chất trung gian phù hợp → ${b}. Hãy chọn phản ứng có thể thực hiện từng bước.`;}
const P={H:{Z:1,group:"IA",name:"Hiđro"},He:{Z:2,group:"VIIIA",name:"Heli"},Li:{Z:3,group:"IA",name:"Liti"},C:{Z:6,group:"IVA",name:"Cacbon"},N:{Z:7,group:"VA",name:"Nitơ"},O:{Z:8,group:"VIA",name:"Oxi"},F:{Z:9,group:"VIIA",name:"Flo"},Ne:{Z:10,group:"VIIIA",name:"Neon"},Na:{Z:11,group:"IA",name:"Natri"},Mg:{Z:12,group:"IIA",name:"Magie"},Al:{Z:13,group:"IIIA",name:"Nhôm"},Si:{Z:14,group:"IVA",name:"Silic"},P:{Z:15,group:"VA",name:"Photpho"},S:{Z:16,group:"VIA",name:"Lưu huỳnh"},Cl:{Z:17,group:"VIIA",name:"Clo"},K:{Z:19,group:"IA",name:"Kali"},Ca:{Z:20,group:"IIA",name:"Canxi"},Fe:{Z:26,group:"VIIIB",name:"Sắt"},Cu:{Z:29,group:"IB",name:"Đồng"},Zn:{Z:30,group:"IIB",name:"Kẽm"},Br:{Z:35,group:"VIIA",name:"Brom"},Ag:{Z:47,group:"IB",name:"Bạc"},I:{Z:53,group:"VIIA",name:"Iot"},Ba:{Z:56,group:"IIA",name:"Bari"}};
function periodic(s){const x=P[s.trim()]; return x?`${x.name} (${s}): Z=${x.Z}, nhóm ${x.group}`:"Chưa có nguyên tố này trong bộ tra cứu nhanh.";}
function solubility(x){if(/AgCl/i.test(x))return "AgCl: kết tủa trắng, rất ít tan."; if(/BaSO4/i.test(x)||/Ba2\+.*SO4/i.test(x))return "BaSO4: kết tủa trắng, rất ít tan."; if(/Na|K|NH4/.test(x))return "Muối của Na+, K+, NH4+ thường tan."; return "Tra theo quy tắc độ tan thông dụng.";}
function acidBase(f){if(/^H[A-Z]|^H2O/.test(f))return "Có khả năng là axit / chất cho H+ tùy cấu trúc."; if(/NaOH|KOH|Ca\(OH\)2|NH3/.test(f))return "Có tính bazơ."; return "Cần xét cấu tạo và môi trường.";}
function activity(m){const order="K Ca Na Mg Al Zn Fe Ni Sn Pb (H) Cu Hg Ag Pt Au".split(" ");const i=order.map(x=>x.replace(/[()]/g,"")).indexOf(m.replace(/[()]/g,""));return i>=0?`${m} nằm ở vị trí ${i+1} trong dãy rút gọn: K > Ca > Na > Mg > Al > Zn > Fe > Ni > Sn > Pb > H > Cu > Hg > Ag > Pt > Au.`:"Không tìm thấy.";}
function electrochem(p){const map={"Ag+/Ag":0.80,"Cu2+/Cu":0.34,"2H+/H2":0.00,"Fe2+/Fe":-0.44,"Zn2+/Zn":-0.76}; const e=map[p.replace(/\s/g,"")]??null;return e==null?"Chưa có cặp này trong bảng nhanh.":`${p}: E° ≈ ${e.toFixed(2)} V`;}
function flame(i){const m={"Na+":"vàng","K+":"tím nhạt","Ca2+":"đỏ cam","Ba2+":"xanh lục","Cu2+":"xanh lục lam"};return m[i.trim()]||"Không có trong bảng nhanh.";}
function precip(s){if(/Ba2\+.*SO4/.test(s)||/Ba.*SO4/.test(s))return "BaSO4↓ trắng";if(/Ag\+.*Cl-/.test(s)||/Ag.*Cl/.test(s))return "AgCl↓ trắng";if(/Fe3\+.*OH-/.test(s))return "Fe(OH)3↓ nâu đỏ";return "Hãy xét tích số tan và quy tắc độ tan.";}
function functional(f){if(/COOH/.test(f))return "Nhóm -COOH: axit cacboxylic";if(/CHO/.test(f))return "Nhóm -CHO: anđehit";if(/COO/.test(f))return "Có thể là este";if(/OH/.test(f))return "Nhóm -OH: ancol/phenol tùy cấu trúc";return "Chưa nhận diện được nhóm chức phổ biến.";}
function indicator(ph){ph=Number(ph);return ph<3?"Metyl da cam: vùng axit mạnh; quỳ tím chuyển đỏ.":ph<8.2?"Phenolphthalein không màu; quỳ tím phụ thuộc vùng pH.":"Phenolphthalein hồng trong môi trường bazơ.";}
function nomenclature(f){const x=f.trim();const names={"Na2CO3":"Natri cacbonat","CaCO3":"Canxi cacbonat","H2SO4":"Axit sulfuric","HCl":"Axit clohidric","NaOH":"Natri hiđroxit","FeCl3":"Sắt(III) clorua"};return names[x]||"Chưa có tên trong từ điển nhanh.";}
function significant(x){const s=String(x).trim();const z=s.replace(/^0+(?=\d)/,"").replace(/^0\./,"").replace(/0+$/,"");return `Phần có nghĩa gần đúng: ${z||s}.`;}
function empirical(a){const m=[12.011,1.008,16.00];const n=a.map((x,i)=>Number(x)/m[i]);const mn=Math.min(...n);return `Tỉ lệ mol xấp xỉ: ${(n[0]/mn).toFixed(3)} : ${(n[1]/mn).toFixed(3)} : ${(n[2]/mn).toFixed(3)}`;}
