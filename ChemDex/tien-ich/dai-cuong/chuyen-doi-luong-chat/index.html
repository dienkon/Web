<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chuyển đổi lượng chất - Công cụ Hóa Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800 selection:bg-blue-100 selection:text-blue-900">
    <a href="../../" class="fixed top-4 left-4 md:top-6 md:left-6 z-50 flex items-center justify-center w-10 h-10 bg-white rounded-full shadow-[0_2px_10px_rgb(0,0,0,0.06)] border border-slate-100 text-slate-400 hover:text-slate-800 hover:scale-105 active:scale-95 transition-all duration-200">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <main class="w-full max-w-md">
        <div class="glass-effect rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-6 sm:p-8">
            <form id="calcForm" class="space-y-4">
                <div>
                    <label for="molarMass" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 ml-1">Khối lượng mol (M) (g/mol)</label>
                    <input type="number" id="molarMass" step="any" placeholder="VD: 58.5 cho NaCl"
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium text-slate-800 placeholder-slate-400">
                </div>
                
                <div class="h-px w-full bg-slate-100 my-4"></div>
                <p class="text-xs text-slate-400 text-center mb-4">Nhập vào 1 đại lượng bất kỳ bên dưới, các đại lượng còn lại sẽ tự tính.</p>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="mass" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 ml-1">Khối lượng (m) (g)</label>
                        <input type="number" id="mass" step="any" placeholder="0" class="calc-input w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium text-slate-800 placeholder-slate-400">
                    </div>
                    <div>
                        <label for="mol" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 ml-1">Số mol (n) (mol)</label>
                        <input type="number" id="mol" step="any" placeholder="0" class="calc-input w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium text-slate-800 placeholder-slate-400">
                    </div>
                    <div>
                        <label for="volume" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 ml-1">Thể tích khí đkc (V) (L)</label>
                        <input type="number" id="volume" step="any" placeholder="0" class="calc-input w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium text-slate-800 placeholder-slate-400">
                    </div>
                    <div>
                        <label for="particles" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 ml-1">Số hạt (N)</label>
                        <input type="text" id="particles" placeholder="VD: 6.022e23" class="calc-input w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium text-slate-800 placeholder-slate-400">
                    </div>
                </div>
            </form>
            
            <script>
                const molarMassInput = document.getElementById("molarMass");
                const massInput = document.getElementById("mass");
                const molInput = document.getElementById("mol");
                const volumeInput = document.getElementById("volume");
                const particlesInput = document.getElementById("particles");
                
                const NA = 6.02214076e23; // Avogadro
                const V_M = 24.79; // Thể tích mol đkc (25°C, 1 bar)

                function updateValues(source) {
                    let n = 0;
                    
                    // Xóa các lỗi
                    [massInput, molInput, volumeInput, particlesInput].forEach(el => el.classList.remove('border-red-400', 'bg-red-50'));

                    if (source === molInput) {
                        n = parseFloat(molInput.value) || 0;
                    } else if (source === massInput) {
                        const m = parseFloat(massInput.value) || 0;
                        const M = parseFloat(molarMassInput.value) || 0;
                        if (M > 0) {
                            n = m / M;
                        } else {
                            if (massInput.value) massInput.classList.add('border-red-400', 'bg-red-50');
                            return;
                        }
                    } else if (source === volumeInput) {
                        const v = parseFloat(volumeInput.value) || 0;
                        n = v / V_M;
                    } else if (source === particlesInput) {
                        const N = parseFloat(particlesInput.value) || 0;
                        n = N / NA;
                    }

                    if (isNaN(n) || n < 0) n = 0;

                    // Update fields
                    if (source !== molInput) molInput.value = n ? n.toPrecision(5) : '';
                    if (source !== massInput) {
                        const M = parseFloat(molarMassInput.value) || 0;
                        massInput.value = (n && M) ? (n * M).toPrecision(5) : '';
                    }
                    if (source !== volumeInput) volumeInput.value = n ? (n * V_M).toPrecision(5) : '';
                    if (source !== particlesInput) particlesInput.value = n ? (n * NA).toExponential(3) : '';
                }

                document.querySelectorAll('.calc-input').forEach(input => {
                    input.addEventListener('input', (e) => updateValues(e.target));
                });
                
                molarMassInput.addEventListener('input', () => {
                    // Ưu tiên cập nhật từ số mol đang có
                    if (molInput.value) updateValues(molInput);
                    else updateValues(massInput); // Nếu ko có số mol thì giữ khối lượng
                });
            </script>
        </div>
    </main>
</body>
</html>
