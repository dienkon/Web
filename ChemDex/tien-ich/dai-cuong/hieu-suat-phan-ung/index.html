<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hiệu suất & Chất giới hạn - Công cụ Hóa Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800 selection:bg-blue-100 selection:text-blue-900">
    <a href="../../" class="fixed top-4 left-4 md:top-6 md:left-6 z-50 flex items-center justify-center w-10 h-10 bg-white rounded-full shadow-[0_2px_10px_rgb(0,0,0,0.06)] border border-slate-100 text-slate-400 hover:text-slate-800 hover:scale-105 active:scale-95 transition-all duration-200">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <main class="w-full max-w-md">
        <div class="glass-effect rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-6 sm:p-8">
            <div class="space-y-6">
                <!-- Tabs -->
                <div class="flex space-x-2 border-b border-slate-200">
                    <button class="tab-btn active px-4 py-2 text-sm font-semibold text-blue-600 border-b-2 border-blue-600" data-target="limit">Chất giới hạn</button>
                    <button class="tab-btn px-4 py-2 text-sm font-semibold text-slate-500 hover:text-slate-700" data-target="yield">Hiệu suất (H%)</button>
                </div>

                <!-- Chất giới hạn Form -->
                <form id="limit" class="tab-content space-y-4">
                    <p class="text-xs text-slate-500 font-semibold mb-2">Cho phản ứng: aA + bB → Sản phẩm</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Hệ số a</label>
                            <input type="number" id="lm-a" step="any" placeholder="1" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Mol A ban đầu</label>
                            <input type="number" id="lm-na" step="any" placeholder="0" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Hệ số b</label>
                            <input type="number" id="lm-b" step="any" placeholder="1" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Mol B ban đầu</label>
                            <input type="number" id="lm-nb" step="any" placeholder="0" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                        </div>
                    </div>
                    <button type="button" onclick="calcLimit()" class="w-full py-4 mt-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-2xl shadow-lg transition-all active:scale-[0.98]">Xác định</button>
                    
                    <div id="lm-result" class="hidden mt-4 bg-blue-50 border border-blue-100 rounded-2xl p-4 text-center"></div>
                </form>

                <!-- Hiệu suất Form -->
                <form id="yield" class="tab-content hidden space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Lượng thực tế thu được (m hoặc n)</label>
                        <input type="number" id="y-actual" step="any" class="calc-y w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Lượng lý thuyết (m hoặc n)</label>
                        <input type="number" id="y-theoretical" step="any" class="calc-y w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2 ml-1">Hiệu suất (H%) (%)</label>
                        <input type="number" id="y-h" step="any" class="calc-y w-full px-4 py-3 bg-blue-50 border border-blue-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-blue-900 font-bold">
                    </div>
                    <p class="text-xs text-slate-400 text-center">Nhập 2 ô bất kỳ để tính ô còn lại.</p>
                </form>
            </div>

            <script>
                // Tabs
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.tab-btn').forEach(b => {
                            b.classList.remove('active', 'text-blue-600', 'border-b-2', 'border-blue-600');
                            b.classList.add('text-slate-500');
                        });
                        btn.classList.add('active', 'text-blue-600', 'border-b-2', 'border-blue-600');
                        btn.classList.remove('text-slate-500');
                        
                        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                        document.getElementById(btn.dataset.target).classList.remove('hidden');
                    });
                });

                // Chất giới hạn
                function calcLimit() {
                    const a = parseFloat(document.getElementById('lm-a').value) || 1;
                    const na = parseFloat(document.getElementById('lm-na').value) || 0;
                    const b = parseFloat(document.getElementById('lm-b').value) || 1;
                    const nb = parseFloat(document.getElementById('lm-nb').value) || 0;

                    const res = document.getElementById('lm-result');
                    res.classList.remove('hidden');

                    if (na/a < nb/b) {
                        res.innerHTML = `<span class="font-bold text-red-600">Chất A hết (Giới hạn).</span><br><span class="text-sm text-slate-600">Chất B dư: ${(nb - (na/a)*b).toPrecision(4)} mol.</span>`;
                    } else if (na/a > nb/b) {
                        res.innerHTML = `<span class="font-bold text-red-600">Chất B hết (Giới hạn).</span><br><span class="text-sm text-slate-600">Chất A dư: ${(na - (nb/b)*a).toPrecision(4)} mol.</span>`;
                    } else {
                        res.innerHTML = `<span class="font-bold text-emerald-600">Phản ứng vừa đủ.</span><br><span class="text-sm text-slate-600">Không có chất dư.</span>`;
                    }
                }

                // Hiệu suất logic
                const yInputs = { act: document.getElementById('y-actual'), the: document.getElementById('y-theoretical'), h: document.getElementById('y-h') };
                document.querySelectorAll('.calc-y').forEach(el => el.addEventListener('input', (e) => {
                    let act = parseFloat(yInputs.act.value);
                    let the = parseFloat(yInputs.the.value);
                    let h = parseFloat(yInputs.h.value);

                    if (e.target !== yInputs.h && !isNaN(act) && !isNaN(the) && the !== 0) yInputs.h.value = ((act / the) * 100).toPrecision(5);
                    if (e.target !== yInputs.act && !isNaN(h) && !isNaN(the)) yInputs.act.value = (the * h / 100).toPrecision(5);
                    if (e.target !== yInputs.the && !isNaN(act) && !isNaN(h) && h !== 0) yInputs.the.value = (act * 100 / h).toPrecision(5);
                }));
            </script>
        </div>
    </main>
</body>
</html>
