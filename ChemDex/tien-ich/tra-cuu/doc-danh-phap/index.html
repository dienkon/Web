<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đọc danh pháp - Công cụ Hóa Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .loading-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800 selection:bg-emerald-100 selection:text-emerald-900">
    <a href="../../" class="fixed top-4 left-4 md:top-6 md:left-6 z-50 flex items-center justify-center w-10 h-10 bg-white rounded-full shadow-[0_2px_10px_rgb(0,0,0,0.06)] border border-slate-100 text-slate-400 hover:text-slate-800 hover:scale-105 active:scale-95 transition-all duration-200">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <main class="w-full max-w-md">
        <div class="glass-effect rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-6 sm:p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 mb-4">
                    <i class="fa-solid fa-spell-check text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">Đọc danh pháp Hóa học</h1>
                <p class="text-sm text-slate-500 mt-2">Nhập công thức hóa học (VD: NaCl, H2SO4) hoặc tên thường (VD: Thuốc tím) để tra cứu.</p>
            </div>

            <div class="space-y-6">
                <!-- Input Area -->
                <div class="relative">
                    <input 
                        type="text" 
                        id="formulaInput" 
                        placeholder="VD: KMnO4, Thuốc tím..." 
                        class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-4 pl-12 text-slate-800 font-medium placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
                        autocomplete="off"
                    />
                    <i class="fa-solid fa-flask absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    
                    <button id="readBtn" class="absolute right-2 top-2 bottom-2 px-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-medium transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-search"></i>
                        <span>Tra cứu</span>
                    </button>
                </div>

                <!-- Result Area -->
                <div id="resultArea" class="hidden">
                    <div class="p-5 rounded-2xl border border-emerald-100 bg-emerald-50/50 relative overflow-hidden text-sm">
                        <div id="resultContent" class="text-slate-700 leading-relaxed space-y-3">
                            <!-- Kết quả -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="./engine.js"></script>
    <script>
        const input = document.getElementById('formulaInput');
        const readBtn = document.getElementById('readBtn');
        const resultArea = document.getElementById('resultArea');
        const resultContent = document.getElementById('resultContent');

        function processNomenclature() {
            const query = input.value.trim();
            if (!query) {
                input.focus();
                return;
            }

            resultArea.classList.remove('hidden');
            resultContent.innerHTML = '';

            try {
                // Gọi hàm từ engine.js
                const result = NomenclatureEngine.analyze(query);
                
                let html = '';
                if (result.found) {
                    html += `<div class="mb-3"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Công thức:</span> <div class="text-lg font-bold text-slate-900 mt-1">${result.formula}</div></div>`;
                    html += `<div class="mb-3"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Tên IUPAC:</span> <div class="font-medium text-slate-800 mt-1">${result.iupac}</div></div>`;
                    if (result.commonName) {
                        html += `<div class="mb-3"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Tên thường:</span> <div class="font-medium text-slate-800 mt-1">${result.commonName}</div></div>`;
                    }
                    html += `<div class="mb-1"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Phân loại:</span> <div class="inline-block bg-slate-200 text-slate-700 px-2 py-0.5 rounded text-xs ml-2">${result.type}</div></div>`;
                } else {
                    html = `<div class="text-amber-600 font-medium flex items-start gap-2">
                                <i class="fa-solid fa-circle-info mt-0.5"></i>
                                <span>Chưa tìm thấy hoặc không thể phân tích danh pháp của "${query}". Vui lòng kiểm tra lại cú pháp (VD: H2SO4, Fe2(SO4)3, C2H5OH).</span>
                            </div>`;
                }

                resultContent.innerHTML = html;
            } catch (error) {
                resultContent.innerHTML = `<div class='text-red-500 font-medium'><i class='fa-solid fa-triangle-exclamation mr-1'></i> Đã xảy ra lỗi khi phân tích.</div>`;
            }
        }

        readBtn.addEventListener('click', processNomenclature);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                processNomenclature();
            }
        });
    </script>
</body>
</html>
