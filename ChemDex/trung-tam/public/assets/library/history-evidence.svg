    <text x="42" y="153" font-size="43" font-weight="700">Con người.</text>
    <text x="42" y="209" font-size="43" font-weight="700">Dấu mốc.</text>
    <text x="42" y="265" font-size="43" font-weight="700">Bằng chứng.</text>
    <text x="42" y="343" font-size="19">Quan sát · Đo lường</text>
