<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Lịch sử khoa học và bằng chứng</title>
  <desc id="desc">Minh họa hồ sơ nghiên cứu và chiếc cân, biểu tượng cho quan sát, đo lường và đối chiếu nguồn.</desc>
