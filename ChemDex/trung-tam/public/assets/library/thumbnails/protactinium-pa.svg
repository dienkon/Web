<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" rx="24" fill="url(#bg)"/>
  <line x1="656" y1="0" x2="656" y2="450" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="4,8" opacity="0.08"/><line x1="562" y1="0" x2="562" y2="450" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="4,8" opacity="0.08"/><line x1="468" y1="0" x2="468" y2="450" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="4,8" opacity="0.08"/><line x1="374" y1="0" x2="374" y2="450" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="4,8" opacity="0.08"/><line x1="280" y1="0" x2="280" y2="450" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="4,8" opacity="0.08"/>
  <circle cx="710" cy="65" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="110" cy="390" r="190" fill="#ffffff" opacity="0.04"/>
  
  <!-- Left Identity Column -->
  <g transform="translate(48, 90)">
    <rect x="0" y="0" width="auto" height="24" rx="6" fill="#ffffff" fill-opacity="0.15"/>
    <text x="8" y="16" fill="#f472b6" font-family="system-ui, sans-serif" font-weight="800" font-size="10.5" letter-spacing="0.8">HỌ ACTINI · NĂNG LƯỢNG HẠT NHÂN 5f</text>
    
    <!-- Big Chemical Formula -->
    <text x="0" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="42" letter-spacing="1">
      Pa
    </text>
    
    <!-- Substance Name -->
    <text x="0" y="118" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="22">
      Protactinium
    </text>
    
    <!-- Specs and reading badge -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="150" height="28" rx="8" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
      <text x="12" y="18" fill="#e2e8f0" font-family="sans-serif" font-weight="700" font-size="12">M = 231.04 g/mol</text>
      
      <rect x="160" y="0" width="140" height="28" rx="8" fill="#fde047" fill-opacity="0.2" stroke="#fde047" stroke-opacity="0.4" stroke-width="1"/>
      <text x="172" y="18" fill="#fef08a" font-family="sans-serif" font-weight="700" font-size="12">1.000+ từ · Khảo cứu</text>
    </g>
    
    <text x="0" y="235" fill="#e0f2fe" opacity="0.9" font-family="system-ui, sans-serif" font-weight="500" font-size="13">
      Tài liệu số hóa · Cấu trúc 3D &amp; Phản ứng thực nghiệm
    </text>
  </g>
  
  <!-- Right Graphic Box -->
  <rect x="435" y="54" width="320" height="342" rx="22" fill="#0f172a" fill-opacity="0.38" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  <g transform="translate(435, 54)">
    
      <!-- Element Tile Showcase -->
      <g transform="translate(160, 155)">
        <!-- Orbital path rings -->
        <ellipse cx="0" cy="0" rx="90" ry="40" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.4" transform="rotate(-2)"/>
        <ellipse cx="0" cy="0" rx="90" ry="40" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.4" transform="rotate(58)"/>
        <ellipse cx="0" cy="0" rx="90" ry="40" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.4" transform="rotate(118)"/>
        
        <!-- Periodic Card -->
        <rect x="-65" y="-75" width="130" height="150" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#f472b6" stroke-width="2.5"/>
        <text x="-48" y="-45" fill="#f472b6" font-family="sans-serif" font-weight="900" font-size="16">91</text>
        <text x="0" y="15" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="48">Pa</text>
        <text x="0" y="42" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-weight="700" font-size="12">Protactinium</text>
        <text x="0" y="60" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-weight="800" font-size="11">231.04</text>
      </g>
    
    <text x="160" y="318" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-weight="600" font-size="11.5">ChemDex Digital Reference Library</text>
  </g>
</svg>
