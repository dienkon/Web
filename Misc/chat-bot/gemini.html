<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hóa học AI Tutor (Gemini)</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .box {
        width: 100%;
        max-width: 800px;
        height: 90vh;
        background: white;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .header {
        background: #16a34a;
        color: white;
        padding: 15px 20px;
        font-size: 20px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 8px;
        white-space: pre-wrap;
        line-height: 1.5;
        word-wrap: break-word;
      }
      .user {
        background: #2563eb;
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 0;
      }
      .bot {
        background: #f3f4f6;
        color: #1f2937;
        align-self: flex-start;
        border-bottom-left-radius: 0;
      }
      .error-msg {
        background: #fee2e2;
        color: #b91c1c;
        align-self: center;
        text-align: center;
      }
      .input-area {
        display: flex;
        border-top: 1px solid #e5e7eb;
        background: #f9fafb;
        padding: 10px;
        gap: 10px;
      }
      select {
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: white;
        outline: none;
        cursor: pointer;
        font-weight: bold;
        color: #374151;
      }
      input {
        flex: 1;
        padding: 12px 15px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        outline: none;
        font-size: 15px;
      }
      input:focus {
        border-color: #16a34a;
      }
      button {
        padding: 12px 20px;
        background: #16a34a;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
        transition: background 0.2s;
      }
      button:hover {
        background: #15803d;
      }
      button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="header">
        <span>🧪 Hóa học AI Tutor</span>
      </div>

      <div class="chat" id="chat">
        <div class="msg bot">
          Chào bạn! Mình là trợ giảng Hóa học AI. Bạn cần giải bài tập hay có
          câu hỏi gì về Hóa học hôm nay?
        </div>
      </div>

      <div class="input-area">
        <select id="model" title="Chọn model AI">
          <option value="">Đang tải danh sách model...</option>
        </select>

        <input
          type="text"
          id="text"
          placeholder="Nhập câu hỏi hóa học của bạn vào đây..."
          autocomplete="off"
        />

        <button id="sendBtn" onclick="send()">Gửi</button>
      </div>
    </div>

    <script>
      const apiKey = "AQ.Ab8RN6IHG-cZURxJh1I8FQ9L9wZpD6miAVb-3Kz0JV71RmDV_Q";

      const SYSTEM_PROMPT = `
Bạn chuyên dev
`;

      const chat = document.getElementById("chat");
      const input = document.getElementById("text");
      const sendBtn = document.getElementById("sendBtn");
      const modelSelect = document.getElementById("model");

      function add(text, type) {
        const div = document.createElement("div");
        div.className = "msg " + type;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }

      async function fetchWithRetry(url, options, retries = 5) {
        const delays = [1000, 2000, 4000, 8000, 16000];
        for (let i = 0; i < retries; i++) {
          try {
            const res = await fetch(url, options);
            if (!res.ok) {
              const errorText = await res.text();
              throw new Error(`Lỗi HTTP ${res.status}: ${errorText}`);
            }
            return await res.json();
          } catch (err) {
            if (i === retries - 1) throw err;
            await new Promise((resolve) => setTimeout(resolve, delays[i]));
          }
        }
      }

      async function loadModels() {
        try {
          modelSelect.innerHTML = `<option value="">Đang tải danh sách model...</option>`;

          let allModels = [];
          let pageToken = "";

          // Lấy full list bằng cách đi qua các trang nextPageToken
          while (true) {
            const url =
              `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}&pageSize=1000` +
              (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : "");

            const data = await fetchWithRetry(url, { method: "GET" });

            if (Array.isArray(data.models)) {
              allModels.push(...data.models);
            }

            if (!data.nextPageToken) break;
            pageToken = data.nextPageToken;
          }

          // Chỉ giữ model có thể generateContent
          const usableModels = allModels.filter(
            (m) =>
              Array.isArray(m.supportedGenerationMethods) &&
              m.supportedGenerationMethods.includes("generateContent"),
          );

          modelSelect.innerHTML = "";

          if (!usableModels.length) {
            modelSelect.innerHTML = `<option value="gemini-2.5-flash" selected>gemini-2.5-flash</option>`;
            return;
          }

          // Sắp xếp cho đẹp
          usableModels.sort((a, b) => {
            const aName = (
              a.displayName ||
              a.baseModelId ||
              a.name ||
              ""
            ).toLowerCase();
            const bName = (
              b.displayName ||
              b.baseModelId ||
              b.name ||
              ""
            ).toLowerCase();
            return aName.localeCompare(bName);
          });

          for (const m of usableModels) {
            const value = m.baseModelId || m.name.replace(/^models\//, "");

            const option = document.createElement("option");

            option.value = value;

            option.textContent = `${m.displayName} (${value})`;

            modelSelect.appendChild(option);
          }
          // Chọn mặc định model đầu tiên
          if (modelSelect.options.length > 0) {
            modelSelect.selectedIndex = 0;
          }
        } catch (err) {
          console.error("Không tải được danh sách model:", err);
          modelSelect.innerHTML = `
        <option value="gemini-2.5-flash" selected>gemini-2.5-flash (mặc định)</option>
        <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
        <option value="gemini-2.5-pro">gemini-2.5-pro</option>
      `;
        }
      }

      async function send() {
        const message = input.value.trim();
        if (!message) return;

        const model = modelSelect.value || "gemini-2.5-flash";

        add(message, "user");
        input.value = "";

        input.disabled = true;
        sendBtn.disabled = true;

        const loadingMsg = add("Đang suy nghĩ...", "bot");

        const payload = {
          systemInstruction: {
            parts: [{ text: SYSTEM_PROMPT }],
          },
          contents: [
            {
              role: "user",
              parts: [{ text: message }],
            },
          ],
        };

        try {
          const data = await fetchWithRetry(
            `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            },
          );

          loadingMsg.remove();

          const answer =
            data.candidates?.[0]?.content?.parts?.[0]?.text ||
            "Không có phản hồi từ AI. Hãy thử lại.";

          add(answer, "bot");
        } catch (error) {
          console.error(error);
          loadingMsg.remove();
          add(
            "Lỗi kết nối hoặc API Key không hợp lệ. Vui lòng kiểm tra lại cấu hình hoặc thử lại sau ít phút.",
            "error-msg",
          );
        } finally {
          input.disabled = false;
          sendBtn.disabled = false;
          input.focus();
        }
      }

      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !sendBtn.disabled) send();
      });

      // Tự load model khi mở trang
      loadModels();
    </script>
  </body>
</html>
