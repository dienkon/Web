      updateExtScale();
      this.syncLcdToPopup();

      popWin.onbeforeunload = () => {

    /* -------------------------------------------------------------------------
     * 2. Real-time LCD Mirroring
     * ------------------------------------------------------------------------- */
    setupRealtimeMirror() {
      if (!this.lcdScreen) return;

      const sync = () => {
        this.syncLcdToPopup();
      };

      const observer = new MutationObserver(sync);
      observer.observe(this.lcdScreen, {
        childList: true,
        subtree: true,
        attributes: true,
        characterData: true
      });

      this.syncLcdToPopup();
    }

    syncLcdToPopup() {
      if (!this.lcdScreen) return;

      // 1. Sync to in-page popup if visible
      if (this.popupLcdScreen && this.popupWindow && this.popupWindow.style.display !== 'none') {
        this.popupLcdScreen.innerHTML = this.lcdScreen.innerHTML;
        this.popupLcdScreen.className = this.lcdScreen.className + ' popup-lcd' + (this.hasLcdGrid ? '' : ' no-grid');
      }

      // 2. Sync to detached external popup window if open
      if (this.externalPopupWin && !this.externalPopupWin.closed) {
        try {
          const extScreen = this.externalPopupWin.document.getElementById('ext-lcd-screen');
          if (extScreen) {
            extScreen.innerHTML = this.lcdScreen.innerHTML;
            extScreen.className = this.lcdScreen.className + ' ext-lcd-screen' + (this.hasLcdGrid ? '' : ' no-grid');
          }
        } catch (e) {}
      }
    }

    /* -------------------------------------------------------------------------
     * 3. Draggable & Resizable Window Utility
     * ------------------------------------------------------------------------- */
    makeDraggable(element, handle) {
      let isDragging = false;
      let startX, startY, origX, origY;

      const startDrag = (clientX, clientY, target) => {
        if (target.closest('.win-btn') || target.closest('.popup-tool-btn')) return false;
        isDragging = true;
        startX = clientX;
        startY = clientY;
        const rect = element.getBoundingClientRect();
        origX = rect.left;
        origY = rect.top;
        return true;
      };

      const moveDrag = (clientX, clientY) => {
        if (!isDragging) return;
        const dx = clientX - startX;
        const dy = clientY - startY;
        const maxL = window.innerWidth - element.offsetWidth;
        const maxT = window.innerHeight - 40;
        element.style.left = `${Math.max(0, Math.min(maxL, origX + dx))}px`;
        element.style.top = `${Math.max(30, Math.min(maxT, origY + dy))}px`;
      };

      const stopDrag = () => {
        isDragging = false;
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        document.removeEventListener('touchmove', onTouchMove);
        document.removeEventListener('touchend', onTouchEnd);
        document.removeEventListener('touchcancel', onTouchEnd);
      };

      const onMouseDown = (e) => {
        if (!startDrag(e.clientX, e.clientY, e.target)) return;
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
        e.preventDefault();
      };

      const onMouseMove = (e) => {
        moveDrag(e.clientX, e.clientY);
      };

      const onMouseUp = () => {
        stopDrag();
      };

      const onTouchStart = (e) => {
        const touch = e.touches[0];
        if (!touch || !startDrag(touch.clientX, touch.clientY, e.target)) return;
        document.addEventListener('touchmove', onTouchMove, { passive: false });
        document.addEventListener('touchend', onTouchEnd);
        document.addEventListener('touchcancel', onTouchEnd);
      };

      const onTouchMove = (e) => {
        if (!isDragging) return;
        const touch = e.touches[0];
        if (!touch) return;
        e.preventDefault();
        moveDrag(touch.clientX, touch.clientY);
      };

      const onTouchEnd = () => {
        stopDrag();
      };

      handle.addEventListener('mousedown', onMouseDown);
      handle.addEventListener('touchstart', onTouchStart, { passive: false });
    }

    makeResizable(element, handle) {
      let isResizing = false;
      let startX, startY, startW;

      const startResize = (clientX, clientY) => {
        isResizing = true;
        startX = clientX;
        startY = clientY;
        startW = element.offsetWidth;
      };

      const moveResize = (clientX) => {
        if (!isResizing) return;
        const dx = clientX - startX;
        const newW = Math.max(300, startW + dx);
        const baseW = 384;
        const newZoom = (newW - 24) / baseW;
        this.setPopupZoom(newZoom);
      };

      const stopResize = () => {
        isResizing = false;
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        document.removeEventListener('touchmove', onTouchMove);
        document.removeEventListener('touchend', onTouchEnd);
        document.removeEventListener('touchcancel', onTouchEnd);
      };

      const onMouseDown = (e) => {
        startResize(e.clientX, e.clientY);
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
        e.preventDefault();
      };

      const onMouseMove = (e) => {
        moveResize(e.clientX);
      };

      const onMouseUp = () => {
        stopResize();
      };

      const onTouchStart = (e) => {
        const touch = e.touches[0];
        if (!touch) return;
        startResize(touch.clientX, touch.clientY);
        document.addEventListener('touchmove', onTouchMove, { passive: false });
        document.addEventListener('touchend', onTouchEnd);
        document.addEventListener('touchcancel', onTouchEnd);
      };

      const onTouchMove = (e) => {
        if (!isResizing) return;
        const touch = e.touches[0];
        if (!touch) return;
        e.preventDefault();
        moveResize(touch.clientX);
      };

      const onTouchEnd = () => {
        stopResize();
      };

      handle.addEventListener('mousedown', onMouseDown);
      handle.addEventListener('touchstart', onTouchStart, { passive: false });
    }

    /* -------------------------------------------------------------------------
     * 4. Screen Capture (LCD & Full Calculator)
     * ------------------------------------------------------------------------- */
        triggerDownload(blob) {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `casio_fx580vnx_screen_${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    async copyLcdScreenToClipboard() {
      await this.captureLcdScreen(false);
    }

    async captureLcdScreen(download = true) {
      try {
        const renderBlob = () => new Promise((resolve, reject) => {
          try {
            const offCanvas = document.createElement('canvas');
            const width = 768; // 2x scale of 384
            const height = 290; // 2x scale of 145
            offCanvas.width = width;
            offCanvas.height = height;
            const ctx = offCanvas.getContext('2d');

            // Draw LCD background
            ctx.fillStyle = '#d6e3d6';
            ctx.fillRect(0, 0, width, height);

            // Draw LCD subtle scanlines / dot grid
            if (this.hasLcdGrid) {
              ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
              for (let y = 0; y < height; y += 3) {
                ctx.fillRect(0, y, width, 1.5);
              }
              for (let x = 0; x < width; x += 3) {
                ctx.fillRect(x, 0, 1.5, height);
              }
            }

            // Clone LCD HTML for SVG foreignObject
            const clone = this.lcdScreen.cloneNode(true);
            const origStatusBar = this.lcdScreen.querySelector('.lcd-status-bar');
            if (origStatusBar && origStatusBar.style.display !== 'none') {
              const cloneBar = clone.querySelector('.lcd-status-bar');
              if (cloneBar) cloneBar.style.display = 'flex';
            }

            let fontDef = '';
            try {
              const styleEl = document.querySelector('style');
              if (styleEl) {
                const m = styleEl.textContent.match(/@font-face\s*\{[\s\S]*?\}/);
                if (m) fontDef = m[0];
              }
            } catch (e) {}

            const svgString = `
          <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
            <foreignObject width="100%" height="100%">
              <div xmlns="http://www.w3.org/1999/xhtml" style="width: 384px; height: 145px; transform: scale(2); transform-origin: top left; font-family: 'CasioClassWiz', monospace; color: #121811; position: relative;">
                <style>
                  ${fontDef}
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'CasioClassWiz', monospace; color: #121811; }
                  .lcd-status-bar { height: 14%; min-height: 11px; display: flex; justify-content: space-between; align-items: center; padding: 0 1px; border-bottom: 1px solid rgba(40,42,40,0.15); }
                  .status-group { display: flex; align-items: center; gap: 3px; height: 100%; }

              ctx.drawImage(img, 0, 0);

                if (blob) resolve(blob);
                else reject(new Error('Canvas toBlob failed'));

          } catch (err) {

        // 1. Initiate Deferred Clipboard write SYNCHRONOUSLY to preserve active User Gesture
        let copied = false;
        let blob = null;

        if (navigator.clipboard && typeof window.ClipboardItem !== 'undefined') {
          try {
            // Passing a Promise directly into ClipboardItem keeps user activation active in Chrome/Edge/Safari
            const blobPromise = renderBlob();
            await navigator.clipboard.write([
              new ClipboardItem({ 'image/png': blobPromise })
            ]);
            copied = true;
            try { blob = await blobPromise; } catch (e) {}
          } catch (e) {
            console.warn('Promise-based ClipboardItem write failed, trying fallback:', e);
          }
        }

        // If not copied yet, resolve blob directly
        if (!blob) {
          try {
            blob = await renderBlob();
          } catch (e) {
            console.error('Blob render error:', e);
          }
        }

        // If direct write wasn't tried or failed, try write with resolved blob as secondary attempt
        if (!copied && blob && navigator.clipboard && typeof window.ClipboardItem !== 'undefined') {
          try {
            await navigator.clipboard.write([
              new ClipboardItem({ 'image/png': blob })
            ]);
            copied = true;
          } catch (e) {
            console.warn('Direct Clipboard write failed:', e);
          }
        }

        // 2. Feedback & Download Handling
        if (copied) {
          if (download) {
            this.triggerDownload(blob);
            this.showToast('✅ Đã sao chép ảnh LCD vào Clipboard và tải về file PNG!');
          } else {
            this.showToast('📋 Đã sao chép ảnh LCD vào Clipboard! (Nhấn Ctrl+V để dán)');
          }
        } else {
          // If clipboard was blocked by browser permissions, ALWAYS download PNG so user never loses image!
          if (blob) {
            this.triggerDownload(blob);
            this.showToast('📁 Đã tự động tải về file ảnh PNG! (Vui lòng bấm biểu tượng cạnh thanh địa chỉ để Bật quyền Clipboard)');
          } else {
            this.showToast('⚠️ Không thể chụp màn hình LCD.');
          }
        }
      } catch (err) {
        console.error('Error capturing LCD screen:', err);
        this.showToast('Không thể chụp màn hình: ' + err.message);
      }
    }

    /* -------------------------------------------------------------------------
     * 5. Calculator Zoom Management & Standalone App Window
     * ------------------------------------------------------------------------- */
    openAppWindow() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        this.showToast('📱 Trên iPad/iPhone: Nhấn nút Chia sẻ [↑] trên Safari ➔ Chọn "Thêm vào MH chính" để mở dạng App!');
        return;
      }
      const w = 420;
      const h = 850;
      const left = Math.max(40, Math.round((screen.width - w) / 2));
      const top = Math.max(20, Math.round((screen.height - h) / 2));
      const features = `width=${w},height=${h},left=${left},top=${top},status=no,toolbar=no,menubar=no,location=no,resizable=yes,scrollbars=no`;
      const url = window.location.href.split('#')[0];
      const newWin = window.open(url, 'CasioFx580App', features);
      if (newWin) {
        newWin.focus();
        this.showToast('Đã mở Casio fx-580VN X trong Cửa sổ App độc lập!');
      } else {
        this.showToast('Vui lòng cho phép popup để mở dạng App!');
      }
    }

    applyZoom(level) {
      if (level === 'fit' || level === 1.0 || level === '1.0') {
        this.calcContainer.style.transform = '';
        this.calcContainer.style.height = '';
        this.calcContainer.style.width = '';
        this.zoomLevel = level === 'fit' ? 'fit' : 1.0;
        this.updateZoomLabel(level === 'fit' ? 'Vừa' : '100%');
        return;
      }

      const z = Math.max(0.5, Math.min(2.5, parseFloat(level)));
      this.zoomLevel = z;
      this.calcContainer.style.height = '100%';
      this.calcContainer.style.transform = `scale(${z})`;
      this.calcContainer.style.transformOrigin = 'center top';
      this.updateZoomLabel(`${Math.round(z * 100)}%`);
    }

    updateZoomLabel(text) {
      const el = document.getElementById('tb-zoom-label');
      if (el) el.textContent = text;
      const select = document.getElementById('tb-zoom-select');
      if (select && this.zoomLevel !== 'fit') {
        select.value = this.zoomLevel.toString();
      }
    }

    zoomIn() {
      const current = typeof this.zoomLevel === 'number' ? this.zoomLevel : 1.0;
      this.applyZoom(current + 0.15);
    }

    zoomOut() {
      const current = typeof this.zoomLevel === 'number' ? this.zoomLevel : 1.0;
      this.applyZoom(current - 0.15);
    }

    /* -------------------------------------------------------------------------
     * 6. Key Logging
     * ------------------------------------------------------------------------- */
    createKeylogPanel() {
      const panel = document.createElement('div');
      panel.id = 'emulator-keylog-panel';
      panel.className = 'keylog-panel';
      panel.style.display = 'none';

      panel.innerHTML = `
        <div class="keylog-header">
          <span>Lịch sử phím (Key Log)</span>
          <div style="display: flex; gap: 4px;">
            <button class="keylog-btn" id="keylog-clear-btn" title="Xóa lịch sử">Xóa</button>
            <button class="keylog-btn" id="keylog-close-btn" title="Đóng">&times;</button>
          </div>
        </div>
        <div class="keylog-body" id="keylog-body">
          <div class="keylog-empty">Chưa có thao tác phím nào</div>
        </div>
      `;

      document.body.appendChild(panel);

      panel.querySelector('#keylog-close-btn').addEventListener('click', () => this.toggleKeylog(false));
      panel.querySelector('#keylog-clear-btn').addEventListener('click', () => {
        this.keyHistory = [];
        this.renderKeylog();
      });
    }

    toggleKeylog(forceState) {
      this.isKeylogOpen = typeof forceState === 'boolean' ? forceState : !this.isKeylogOpen;
      const panel = document.getElementById('emulator-keylog-panel');
      if (panel) panel.style.display = this.isKeylogOpen ? 'flex' : 'none';

      const btn = document.getElementById('tb-btn-keylog');
      if (btn) btn.classList.toggle('active', this.isKeylogOpen);
    }

    setupKeyLogging() {
      // Listen to all calculator button clicks
      document.querySelectorAll('.calc-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-key') || btn.id.replace('btn-', '');
          const label = btn.getAttribute('aria-label') || btn.getAttribute('title') || key;
          this.addKeylogEntry(key, label);
        });
      });
    }

    addKeylogEntry(key, label) {
      this.keyHistory.push({ key, label, time: new Date() });
      if (this.keyHistory.length > this.maxKeyHistory) {
        this.keyHistory.shift();
      }
      if (this.isKeylogOpen) {
        this.renderKeylog();
      }
    }

    renderKeylog() {
      const body = document.getElementById('keylog-body');
      if (!body) return;

      if (this.keyHistory.length === 0) {
        body.innerHTML = '<div class="keylog-empty">Chưa có thao tác phím nào</div>';
        return;
      }

      body.innerHTML = this.keyHistory.map(item => `
        <span class="key-badge key-${item.key}">${item.label}</span>
      `).join(' ');
      body.scrollTop = body.scrollHeight;
    }

    /* -------------------------------------------------------------------------
     * 7. Menu Bar & Toolbar Events
     * ------------------------------------------------------------------------- */
    createModalElement() {
      if (document.getElementById('emulator-modal-overlay')) return;
      const modal = document.createElement('div');
      modal.id = 'emulator-modal-overlay';
      modal.className = 'emulator-modal-overlay';
      modal.innerHTML = `
        <div class="emulator-modal-dialog">
          <div class="emulator-modal-header">
            <div class="emulator-modal-title" id="emulator-modal-title">Thông báo</div>
            <button class="emulator-modal-close" id="emulator-modal-close-btn" aria-label="Đóng">&times;</button>
          </div>
          <div class="emulator-modal-body" id="emulator-modal-body"></div>
          <div class="emulator-modal-footer">
            <button class="emulator-modal-btn" id="emulator-modal-ok-btn">Đóng</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      const hide = () => modal.classList.remove('visible');
      document.getElementById('emulator-modal-close-btn').addEventListener('click', hide);
      document.getElementById('emulator-modal-close-btn').addEventListener('touchend', hide);
      document.getElementById('emulator-modal-ok-btn').addEventListener('click', hide);
      document.getElementById('emulator-modal-ok-btn').addEventListener('touchend', hide);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) hide();
      });
    }

    showCustomModal(title, contentHtml) {
      this.createModalElement();
      const modal = document.getElementById('emulator-modal-overlay');
      const titleEl = document.getElementById('emulator-modal-title');
      const bodyEl = document.getElementById('emulator-modal-body');
      if (titleEl) titleEl.innerHTML = title;
      if (bodyEl) bodyEl.innerHTML = contentHtml;
      if (modal) modal.classList.add('visible');
    }

    setupToolbarEvents() {
      // 0. App Window Mode button
      const btnAppMode = document.getElementById('tb-btn-app-mode');
      if (btnAppMode) {
        btnAppMode.addEventListener('click', () => this.openAppWindow());
      }

      // 1. Slim/Full View toggle
      const btnSlim = document.getElementById('tb-btn-slim');
      if (btnSlim) {
        btnSlim.addEventListener('click', () => {
          this.isSlimMode = !this.isSlimMode;
          btnSlim.classList.toggle('active', this.isSlimMode);
          this.calcContainer.classList.toggle('slim-mode', this.isSlimMode);
        });
      }

      // 2. Pop-up Display button
      const btnPopup = document.getElementById('tb-btn-popup');
      if (btnPopup) {
        btnPopup.addEventListener('click', () => this.togglePopupDisplay());
      }

      // 3. Capture Screen (Camera)
      const btnCapture = document.getElementById('tb-btn-capture');
      if (btnCapture) {
        btnCapture.addEventListener('click', () => this.captureLcdScreen());
      }

      // 4. Zoom selector & buttons
      const zoomSelect = document.getElementById('tb-zoom-select');
      if (zoomSelect) {
        zoomSelect.addEventListener('change', (e) => this.applyZoom(e.target.value));
      }

      const btnZoomIn = document.getElementById('tb-btn-zoom-in');
      if (btnZoomIn) btnZoomIn.addEventListener('click', () => this.zoomIn());

      const btnZoomOut = document.getElementById('tb-btn-zoom-out');
      if (btnZoomOut) btnZoomOut.addEventListener('click', () => this.zoomOut());

      // 5. Key log
      const btnKeylog = document.getElementById('tb-btn-keylog');
      if (btnKeylog) {
        btnKeylog.addEventListener('click', () => this.toggleKeylog());
      }

      // 6. Sound toggle button
      const btnSound = document.getElementById('tb-btn-sound');
      if (btnSound) {
        const toggle = (e) => {
          if (e) {
            e.preventDefault();
            e.stopPropagation();
          }
          if (window.casioApp) {
            const newState = window.casioApp.toggleSound();
            this.showToast(newState ? '🔊 Đã bật âm thanh phím bấm' : '🔇 Đã tắt âm thanh phím bấm', 1800);
          }
        };
        btnSound.addEventListener('click', toggle);
        btnSound.addEventListener('touchend', toggle);

        if (window.casioApp) {
          this.updateSoundButtonUI(window.casioApp.soundEnabled);
        }
      }

      // Cập nhật button
      const btnUpdate = document.getElementById('tb-btn-update');
      if (btnUpdate) {
        let isUpdating = false;
        const runUpdate = (e) => {
          if (e) e.preventDefault();
          if (isUpdating) return;
          isUpdating = true;
          setTimeout(() => { isUpdating = false; }, 2000);
          this.checkForAppUpdate();
        };
        btnUpdate.addEventListener('click', runUpdate);
        btnUpdate.addEventListener('touchend', runUpdate);
      }
    }

    updateSoundButtonUI(enabled) {
      const btnSound = document.getElementById('tb-btn-sound');
      if (!btnSound) return;
      btnSound.classList.toggle('sound-muted', !enabled);
      btnSound.title = enabled ? 'Tắt âm thanh phím bấm (Sound: Đang BẬT - Bấm để Tắt)' : 'Bật âm thanh phím bấm (Sound: Đang TẮT - Bấm để Bật)';
      const iconOn = btnSound.querySelector('.icon-sound-on');
      const iconOff = btnSound.querySelector('.icon-sound-off');
      if (iconOn) iconOn.style.display = enabled ? 'inline-block' : 'none';
      if (iconOff) iconOff.style.display = enabled ? 'none' : 'inline-block';
    }

    setupKeyboardShortcuts() {
      window.addEventListener('keydown', (e) => {
        if (e.key === 'F1') {
          e.preventDefault();
          this.showHelpModal();
          return;
        }
        if (e.ctrlKey || e.metaKey) {
          if (e.key === '=' || e.key === '+') {
            e.preventDefault();
            this.zoomIn();
          } else if (e.key === '-' || e.key === '_') {
            e.preventDefault();
            this.zoomOut();
          } else if (e.key === '0') {
            e.preventDefault();
            this.applyZoom(1.0);
          } else if (e.key.toLowerCase() === 'p') {
            e.preventDefault();
            this.togglePopupDisplay();
          } else if (e.key.toLowerCase() === 's') {
            e.preventDefault();
            this.captureLcdScreen();
          } else if (e.key.toLowerCase() === 'm') {
            e.preventDefault();
            this.openAppWindow();
          } else if (e.key.toLowerCase() === 'b') {
            e.preventDefault();
            if (window.casioApp) {
              const newState = window.casioApp.toggleSound();
              this.showToast(newState ? '🔊 Đã bật âm thanh phím bấm' : '🔇 Đã tắt âm thanh phím bấm', 1800);
            }
          } else if (e.key.toLowerCase() === 'h') {
            e.preventDefault();
            this.showHdsdModal();
          }
        }
      });
    }

    /* -------------------------------------------------------------------------
     * 8. Toast Notifications

    createToastElement() {
      const toast = document.createElement('div');
      toast.id = 'emulator-toast';
      toast.className = 'emulator-toast';
      toast.style.display = 'none';
      document.body.appendChild(toast);
    }

    showToast(message, duration = 3000) {
      const toast = document.getElementById('emulator-toast');
      if (!toast) return;
      toast.textContent = message;
      toast.style.display = 'block';
      toast.classList.add('visible');

      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => {
        toast.classList.remove('visible');
        setTimeout(() => { toast.style.display = 'none'; }, 300);
      }, duration);
    }

    async checkForAppUpdate() {
      // 1. Hiển thị thông báo ngay lập tức ở giữa màn hình
      this.showCustomModal(
        '🔄 Kiểm Tra Cập Nhật',
        `<div style="text-align: center; padding: 16px 0;">
          <div id="update-icon" style="font-size: 38px; margin-bottom: 14px; display: inline-block;">🔄</div>
          <div id="update-status-title" style="font-size: 16px; font-weight: 700; color: #1d1d1f; margin-bottom: 8px;">
            Đang kiểm tra phiên bản mới...
          </div>
          <div id="update-status-desc" style="font-size: 13px; color: #666; line-height: 1.5;">
            Đang kết nối đến máy chủ GitHub để kiểm tra bản cập nhật mới nhất. Vui lòng đợi trong giây lát...
          </div>
        </div>`
      );

      const titleEl = document.getElementById('update-status-title');
      const descEl = document.getElementById('update-status-desc');
      const iconEl = document.getElementById('update-icon');

      try {
        // Xóa bộ nhớ cache của Service Worker / CacheStorage nếu có
        if ('caches' in window) {
          try {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map(name => caches.delete(name)));
          } catch (e) {}
        }

        // Tải thử mã nguồn mới từ máy chủ với query timestamp để bỏ qua cache
        const cleanUrl = window.location.origin + window.location.pathname;
        const checkUrl = cleanUrl + '?check=' + Date.now();

        const response = await fetch(checkUrl, {
          cache: 'no-store',
          headers: {
            'Pragma': 'no-cache',
            'Cache-Control': 'no-cache'
          }
        });

        if (!response.ok) throw new Error('HTTP ' + response.status);

        const remoteText = await response.text();
        const match = remoteText.match(/window\.CASIO_BUILD_VERSION\s*=\s*['"]([^'"]+)['"]/);
        const remoteVersion = match ? match[1] : null;
        const currentVersion = window.CASIO_BUILD_VERSION || '';

        // Nếu máy chủ có bản mới hơn hoặc phát hiện khác biệt
        if (remoteVersion && remoteVersion !== currentVersion) {
          if (iconEl) iconEl.textContent = '✨';
          if (titleEl) {
            titleEl.style.color = '#0066cc';
            titleEl.textContent = 'Đã có phiên bản mới!';
          }
          if (descEl) {
            descEl.innerHTML = `Tìm thấy bản: <b>${remoteVersion}</b><br>Đang tải và làm mới ứng dụng...`;
          }

          localStorage.setItem('casio_updated_success', 'true');

          setTimeout(() => {
            window.location.replace(cleanUrl + '?v=' + Date.now());
            setTimeout(() => { window.location.reload(); }, 300);
          }, 1200);
        } else {
          // Đã là phiên bản mới nhất
          if (iconEl) iconEl.textContent = '✅';
          if (titleEl) {
            titleEl.style.color = '#2e7d32';
            titleEl.textContent = 'Bạn đang dùng bản mới nhất!';
          }
          if (descEl) {
            descEl.innerHTML = `Phiên bản hiện tại: <b>${currentVersion}</b><br>Ứng dụng đã được cập nhật đầy đủ tính năng và giao diện mới nhất.`;
          }
        }
      } catch (err) {
        console.warn('Update check via fetch failed, falling back to direct reload:', err);
        // Fallback: Cho phép người dùng bấm tải lại trực tiếp nếu mạng chậm hoặc lỗi CORS
        if (iconEl) iconEl.textContent = '⚡';
        if (titleEl) {
          titleEl.style.color = '#1d1d1f';
          titleEl.textContent = 'Làm mới ứng dụng';
        }
        if (descEl) {
          descEl.innerHTML = `
            Bấm nút dưới để nạp lại phiên bản mới nhất từ máy chủ:<br><br>
            <button id="btn-force-reload-action" class="emulator-modal-btn" style="background:#0071e3;color:#fff;border:none;border-radius:6px;padding:9px 22px;font-size:13.5px;font-weight:600;cursor:pointer;">
              🔄 Tải lại ngay
            </button>
          `;
        }

        setTimeout(() => {
          const btnReload = document.getElementById('btn-force-reload-action');
          if (btnReload) {
            btnReload.addEventListener('click', () => {
              try { localStorage.setItem('casio_updated_success', 'true'); } catch (e) {}
              const cleanUrl = window.location.origin + window.location.pathname;
              window.location.replace(cleanUrl + '?v=' + Date.now());
              setTimeout(() => { window.location.reload(); }, 200);
            });
          }
        }, 150);
      }
    }

  // Auto-initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      window.emulatorUI = new EmulatorUI();
    });
  } else {
    window.emulatorUI = new EmulatorUI();
  }
})();

  </script>
