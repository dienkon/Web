name: DkTEST iOS Release Build (.ipa)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing GitHub Release tag to attach the .ipa to (e.g., dktest-v2.0.4)"
        required: false
        default: ""
  push:
    tags:
      - "dktest-v*"

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Build DkTEST Capacitor iOS (.ipa)
    runs-on: macos-15
    defaults:
      run:
        working-directory: DkTest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: DkTest/package-lock.json

      - name: Read DkTEST release version
        id: meta
        run: |
          VERSION=$(node -e "console.log(require('./release.json').version)")
          BUILD=$(node -e "console.log(require('./release.json').androidVersionCode)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Built metadata: v$VERSION (build $BUILD)"

      - name: Install dependencies
        run: npm ci

      - name: Build mobile web bundle
        run: npm run build:mobile

      - name: Install matching @capacitor/ios & sync iOS project
        run: |
          CAP_VER=$(node -e "console.log(require('./node_modules/@capacitor/core/package.json').version)")
          npm install --no-save "@capacitor/ios@$CAP_VER"
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.meta.outputs.version }}" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.meta.outputs.build }}" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName DkTEST" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string DkTEST" "$PLIST"

      - name: Build unsigned iOS App with Xcode
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Package unsigned .ipa
        run: |
          APP_PATH=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate compiled .app bundle"
            exit 1
          fi
          mkdir -p dist-ios/Payload
          cp -R "$APP_PATH" dist-ios/Payload/
          IPA_NAME="DkTEST-${{ steps.meta.outputs.version }}-ios-unsigned.ipa"
          (cd dist-ios && zip -r "../$IPA_NAME" Payload)
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA_NAME"
        id: pkg

      - name: Upload iOS .ipa build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dktest-ios-ipa-${{ steps.meta.outputs.version }}
          path: DkTest/${{ steps.pkg.outputs.ipa_name }}
          retention-days: 30

      - name: Attach .ipa to GitHub Release (when triggered by tag or release_tag)
        if: startsWith(github.ref, 'refs/tags/dktest-v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          IPA="DkTest/${{ steps.pkg.outputs.ipa_name }}"
          cd ..
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" \
              --title "DkTEST v${{ steps.meta.outputs.version }}" \
              --notes "Bản phát hành DkTEST v${{ steps.meta.outputs.version }} (bao gồm gói .ipa iOS chưa ký cho AltStore/Sideloadly/Xcode; người dùng iPhone/iPad thông thường có thể cài trực tiếp qua hồ sơ .mobileconfig 1 chạm tại /api/app-download?platform=ios)."
          fi
