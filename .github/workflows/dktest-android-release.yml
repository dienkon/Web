name: DkTEST Android APK Release

on:
  push:
    branches: [main]
    paths: ['DkTest/release.json', 'DkTest/src/**', 'DkTest/android/**', '.github/workflows/dktest-android-release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DkTest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: DkTest/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install dependencies & verify release metadata
        run: |
          npm ci
          npm run check:release

      - name: Build mobile web bundle & sync Android
        run: |
          npm run build:mobile
          npx cap sync android

      - name: Restore persistent Android signing keystore cache
        uses: actions/cache@v4
        with:
          path: ~/.dktest-keystore
          key: dktest-android-signing-keystore-v1

      - name: Prepare deterministic Android signing keystore (prevents APK upgrade package conflicts)
        env:
          KEYSTORE_B64: ${{ secrets.DKTEST_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DKTEST_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DKTEST_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DKTEST_ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.dktest-keystore"
          KS_PATH="$HOME/.dktest-keystore/dktest-signing.jks"
          KS_PASS="${KEYSTORE_PASSWORD:-dktest2026}"
          KS_ALIAS="${KEY_ALIAS:-dktest}"
          K_PASS="${KEY_PASSWORD:-$KS_PASS}"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS_PATH"
            echo "Using signing keystore from GitHub Secret DKTEST_ANDROID_KEYSTORE_B64."
          elif [ ! -f "$KS_PATH" ]; then
            echo "Generating persistent signing keystore for seamless in-place APK upgrades..."
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 9125 \
              -dname "CN=DkTEST, OU=Education, O=DkTEST, L=HCM, ST=HCM, C=VN"
          else
            echo "Reusing cached persistent signing keystore."
          fi

          echo "DKTEST_KEYSTORE_PATH=${KS_PATH}" >> "$GITHUB_ENV"
          echo "DKTEST_KEYSTORE_PASSWORD=${KS_PASS}" >> "$GITHUB_ENV"
          echo "DKTEST_KEY_ALIAS=${KS_ALIAS}" >> "$GITHUB_ENV"
          echo "DKTEST_KEY_PASSWORD=${K_PASS}" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KS_PATH" -storepass "$KS_PASS" -alias "$KS_ALIAS" | grep -E "SHA256:|SHA1:" || true

      - name: Assemble Android Debug APK & prepare release assets
        id: apk
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --console=plain)
          VERSION=$(node -p "require('./release.json').version")
          mkdir -p releases
          APK_NAME="DkTEST-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "releases/${APK_NAME}"
          sha256sum "releases/${APK_NAME}" > "releases/${APK_NAME}.sha256"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "dktest-v${{ steps.apk.outputs.version }}"
          name: "DkTEST v${{ steps.apk.outputs.version }} (Android APK)"
          body: |
            DkTEST Android v${{ steps.apk.outputs.version }} built automatically from DkTest/release.json.
            Xem changelog chi tiết tại DkTest/CHANGELOG.md.
          files: |
            DkTest/releases/${{ steps.apk.outputs.apk_name }}
            DkTest/releases/${{ steps.apk.outputs.apk_name }}.sha256
